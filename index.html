<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Rotación</title>
<meta name="description" content="Bootcamp de Java personal: construir, medir, aplicar y explicar.">
<meta name="theme-color" content="#f1f1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Plan: monocromo gris/negro. Mono (JetBrains Mono) para cifras, etiquetas y la marca; Instrument Sans para leer.
   Layout: columna única de lectura (~760px) con cabecera fija; la hoja de personaje usa dos columnas. */
:root {
  --bg: #f1f1ef;
  --surface: #fafaf9;
  --ink: #131314;
  --ink-2: #48484d;
  --ink-3: #828288;
  --line: #d6d6d3;
  --fill: #e5e5e2;
  --display: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0e;
    --surface: #141416;
    --ink: #ebebe8;
    --ink-2: #a8a8ad;
    --ink-3: #6e6e74;
    --line: #2a2a2e;
    --fill: #1e1e21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0e;
  --surface: #141416;
  --ink: #ebebe8;
  --ink-2: #a8a8ad;
  --ink-3: #6e6e74;
  --line: #2a2a2e;
  --fill: #1e1e21;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-weight: 600; }
code, pre, .mono { font-family: var(--display); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* Cabecera */
.cab {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.cab-in {
  max-width: 1080px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
.marca {
  font-family: var(--display); font-weight: 700; font-size: 14px;
  letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none;
  display: flex; align-items: center; gap: 10px;
}
.marca-ciclo { display: inline-flex; gap: 3px; }
.marca-ciclo i { width: 7px; height: 7px; background: var(--ink); display: block; }
.marca-ciclo i:nth-child(2) { opacity: .55; }
.marca-ciclo i:nth-child(3) { opacity: .25; }
.nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.nav a {
  font-family: var(--display); font-size: 12.5px; text-decoration: none;
  padding: 6px 10px; color: var(--ink-2); white-space: nowrap; border-radius: 2px;
}
.nav a:hover { color: var(--ink); background: var(--fill); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--fill); }
.cab-xp { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 12px; color: var(--ink-2); text-decoration: none; }
.cab-xp b { color: var(--ink); font-weight: 700; }
.barra { height: 4px; background: var(--fill); position: relative; overflow: hidden; }
.barra > i { position: absolute; inset: 0 auto 0 0; background: var(--ink); display: block; }
.cab-xp .barra { width: 90px; }

main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
.col { max-width: 780px; }

/* Utilidades */
.etq {
  font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
}
.muted { color: var(--ink-3); }
.sub { color: var(--ink-2); }
.tab { font-variant-numeric: tabular-nums; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
  padding: 9px 14px; border-radius: 2px; cursor: pointer; font-size: 14px; font-weight: 500;
  text-decoration: none;
}
.btn:hover { opacity: .88; }
.btn .xp { font-family: var(--display); font-size: 12px; opacity: .75; }
.btn.sec { background: transparent; color: var(--ink); }
.btn.sec:hover { background: var(--fill); opacity: 1; }
.btn.fant { background: transparent; color: var(--ink-2); border-color: transparent; padding-left: 6px; padding-right: 6px; text-decoration: underline; text-underline-offset: 3px; }
.btn.fant:hover { color: var(--ink); opacity: 1; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

/* Pips de estado: cuadrado vacío / medio / lleno */
.pips { display: inline-flex; gap: 4px; align-items: center; }
.pip { width: 10px; height: 10px; border: 1.5px solid var(--ink-3); display: inline-block; }
.pip.full { background: var(--ink); border-color: var(--ink); }
.pip.min { border-color: var(--ink); background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
.pip.exp { border-radius: 50%; }
.pip.sep { margin-left: 4px; }

.rango { font-family: var(--display); font-size: 11px; letter-spacing: .08em; color: var(--ink-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 2px; white-space: nowrap; }
.rango.r0 { color: var(--ink-3); border-style: dashed; }
.rango.r3 { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Ruta: portada */
.portada { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; margin-bottom: 36px; }
.ficha, .siguiente, .reglas, .tarjeta { background: var(--surface); border: 1px solid var(--line); padding: 20px; border-radius: 2px; }
.ficha { display: flex; flex-direction: column; gap: 14px; }
.nivel { display: flex; align-items: flex-end; gap: 14px; }
.nivel-num { font-family: var(--display); font-weight: 700; font-size: 76px; line-height: .85; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.nivel-txt { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; }
.nivel-txt strong { font-size: 18px; }
.xp-linea { display: flex; justify-content: space-between; font-family: var(--display); font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.ficha .barra { height: 6px; }
.siguiente { display: flex; flex-direction: column; gap: 10px; }
.siguiente h2 { font-size: 24px; line-height: 1.25; }
.siguiente .acc { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.siguiente .minibox { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; color: var(--ink-2); font-size: 14.5px; }
.siguiente .minibox p { margin: 2px 0; }
.aviso-inicio { font-size: 14.5px; color: var(--ink-2); border: 1px dashed var(--line); padding: 10px 12px; }

.reglas { margin-bottom: 40px; }
.mini-stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.mini-stats dt { font-family: var(--display); font-size: 12px; color: var(--ink-3); padding-top: 1px; }
.mini-stats dd { margin: 0; text-align: right; font-family: var(--display); font-size: 13px; font-variant-numeric: tabular-nums; }
.reglas ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 24px; counter-reset: r; }
.reglas li { counter-increment: r; font-size: 14.5px; color: var(--ink-2); padding-left: 30px; position: relative; }
.reglas li::before { content: counter(r, decimal-leading-zero); position: absolute; left: 0; top: 1px; font-family: var(--display); font-size: 12px; color: var(--ink-3); }
.reglas li strong { color: var(--ink); }

/* Ruta: bloques y semanas */
.bloque { margin-bottom: 34px; }
.bloque-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 4px; }
.bloque-cab h2 { font-size: 20px; }
.bloque-cab h2 .etq { margin-right: 10px; }
.bloque-cab .prog { font-family: var(--display); font-size: 12px; color: var(--ink-2); }
.fila {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 16px; align-items: center;
  padding: 14px 8px; border-bottom: 1px solid var(--line); text-decoration: none;
}
.fila:hover { background: var(--fill); }
.fila .num { font-family: var(--display); font-size: 13px; color: var(--ink-3); }
.fila .tit { font-weight: 600; font-size: 16px; }
.fila .res { color: var(--ink-3); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.fila.actual .num { color: var(--ink); font-weight: 700; }
.fila.actual .num::after { content: " ◂"; }
.leyenda { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); margin: 6px 0 22px; align-items: center; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }

/* Semana */
.migas { display: flex; gap: 14px; align-items: center; font-family: var(--display); font-size: 12.5px; color: var(--ink-3); margin-bottom: 22px; flex-wrap: wrap; }
.migas a { color: var(--ink-2); }
.sem-cab { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 22px; margin-bottom: 26px; }
.sem-num { font-family: var(--display); font-weight: 700; font-size: 56px; line-height: .9; letter-spacing: -0.04em; grid-row: span 3; }
.sem-cab h1 { font-size: 32px; line-height: 1.15; }
.sem-cab .resumen { color: var(--ink-2); margin: 4px 0 0; max-width: 65ch; }
.sem-cab .estado { display: flex; gap: 12px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.ochenta { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); margin-bottom: 18px; background: var(--surface); }
.ochenta > div { padding: 16px 18px; }
.ochenta > div + div { border-left: 1px solid var(--line); }
.ochenta h3 { font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.ochenta h3 .mono { font-weight: 500; color: var(--ink-3); font-size: 12px; }
.ochenta ul, .lista { margin: 0; padding-left: 18px; font-size: 14.5px; color: var(--ink-2); }
.ochenta li + li, .lista li + li { margin-top: 4px; }
.obj { margin-bottom: 18px; }
.obj h3 { font-size: 14px; margin-bottom: 8px; }
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { padding-left: 24px; position: relative; font-size: 15px; }
.checks li + li { margin-top: 5px; }
.checks li::before { content: ""; position: absolute; left: 2px; top: 6px; width: 10px; height: 10px; border: 1.5px solid var(--ink-3); }
.pieza { display: flex; gap: 14px; align-items: baseline; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; margin-bottom: 22px; font-size: 15px; }
.pieza .etq { flex: none; }
.saltos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 26px; position: sticky; top: 53px; z-index: 5; background: var(--bg); padding: 8px 0; }
.saltos a { font-family: var(--display); font-size: 12px; text-decoration: none; border: 1px solid var(--line); padding: 5px 10px; border-radius: 2px; display: inline-flex; gap: 8px; align-items: center; background: var(--surface); }
.saltos a:hover { border-color: var(--ink); }

.sesion { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; margin-bottom: 22px; scroll-margin-top: 110px; }
.sesion > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.paso { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.paso .muted { font-weight: 400; }
.pill { font-family: var(--display); font-size: 11.5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 2px; color: var(--ink-3); white-space: nowrap; }
.pill.ok { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pill.min { border-color: var(--ink); color: var(--ink); }
.sesion .cuerpo { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.sesion h2 { font-size: 22px; line-height: 1.25; }
.objetivo { margin: -8px 0 0; color: var(--ink-2); }
.objetivo .etq { margin-right: 8px; }
.prose { max-width: 70ch; }
.prose p { margin: 0 0 10px; }
.prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { margin: 0 0 10px; padding-left: 22px; }
.prose li + li { margin-top: 4px; }
.prose li > ul { margin: 4px 0 0; }
code { font-size: .86em; background: var(--fill); padding: 1px 5px; border-radius: 2px; }
pre { background: var(--fill); padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.5; margin: 0 0 12px; border-left: 2px solid var(--ink); }
pre code { background: none; padding: 0; font-size: inherit; }
.bloque-sec h4 { font-size: 13px; margin-bottom: 8px; font-family: var(--display); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.minima { border: 1px dashed var(--ink-3); padding: 14px 16px; }
.minima h4 { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pistas .regla { font-size: 13.5px; color: var(--ink-3); margin: -2px 0 10px; }
.pista { border-top: 1px solid var(--line); }
.pista:last-child { border-bottom: 1px solid var(--line); }
.pista-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 10px 2px; cursor: pointer; text-align: left; font-family: var(--display); font-size: 13px; }
.pista-btn:hover:not([disabled]) { background: var(--fill); }
.pista-btn[disabled] { cursor: not-allowed; color: var(--ink-3); }
.pista-cont { padding: 4px 2px 14px; }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line); }
.acciones .hecha { font-family: var(--display); font-size: 13px; }
textarea, input[type="text"] {
  width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px; resize: vertical;
}
textarea:focus, input[type="text"]:focus { border-color: var(--ink); outline: none; }
textarea.mono { font-family: var(--display); font-size: 13px; }
label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
label .muted { font-weight: 400; }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.campos .ancho { grid-column: 1 / -1; }
.lib-estado { font-family: var(--display); font-size: 12px; color: var(--ink-3); }
.lib-estado.ok { color: var(--ink); }
.sem-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 28px; }
.sem-nav a { text-decoration: none; display: flex; flex-direction: column; gap: 2px; max-width: 46%; }
.sem-nav a:last-child { text-align: right; margin-left: auto; }
.sem-nav a span:last-child { font-weight: 600; }

/* Hoja de personaje */
.hoja { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.hoja .ancho { grid-column: 1 / -1; }
.identidad { display: flex; flex-direction: column; gap: 12px; }
.identidad .nombre { font-size: 26px; font-weight: 600; }
.ident-linea { display: grid; grid-template-columns: 120px 1fr; font-size: 14px; gap: 4px 12px; }
.ident-linea dt { color: var(--ink-3); font-family: var(--display); font-size: 12px; padding-top: 2px; }
.ident-linea dd { margin: 0; }
.attr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: baseline; }
.attr + .attr { margin-top: 14px; }
.attr .n { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.attr .n span:first-child { white-space: nowrap; font-weight: 500; }
.attr .n .puntos { flex: 1; border-bottom: 1px dotted var(--ink-3); transform: translateY(-4px); min-width: 20px; }
.attr .v { font-family: var(--display); font-size: 13px; font-variant-numeric: tabular-nums; }
.attr .barra { grid-column: 1 / -1; height: 5px; }
.attr small { grid-column: 1 / -1; color: var(--ink-3); font-size: 12.5px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.stats div { background: var(--surface); padding: 12px 14px; }
.stats b { display: block; font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stats span { font-size: 12.5px; color: var(--ink-3); }
.calor { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.calor i { width: 12px; height: 12px; background: var(--fill); display: block; }
.calor i.c1 { background: var(--ink); opacity: .35; }
.calor i.c2 { background: var(--ink); opacity: .65; }
.calor i.c3 { background: var(--ink); }
.calor i.fut { background: transparent; }
.arbol { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 28px; }
.arbol h4 { font-size: 13px; font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; }
.hab { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; text-decoration: none; }
.hab:hover { background: var(--fill); }
.hab.r0 { color: var(--ink-3); }
.rpips { display: inline-flex; gap: 3px; }
.rpips i { width: 8px; height: 8px; border: 1.5px solid var(--ink-3); display: block; }
.rpips i.on { background: var(--ink); border-color: var(--ink); }

/* Logros */
.logros { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.logro { border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border-radius: 2px; }
.logro.bloq { background: transparent; border-style: dashed; }
.logro.bloq h3 { color: var(--ink-2); }
.logro h3 { font-size: 16px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.logro h3 .mono { font-size: 12px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
.logro p { margin: 0; font-size: 14px; color: var(--ink-2); }
.logro .fecha { font-family: var(--display); font-size: 11.5px; color: var(--ink-3); }
.logro.ok { border-color: var(--ink); }
.logro.ok .sello { display: inline-block; width: 10px; height: 10px; background: var(--ink); margin-right: 8px; }

/* Libreta y ajustes */
.lib-sem { border-top: 1px solid var(--ink); padding: 18px 0 26px; }
.lib-sem h2 { font-size: 19px; margin-bottom: 14px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.lib-sem h2 a { text-decoration: none; }
.lib-sem h2 .mono { color: var(--ink-3); font-size: 14px; }
.herr { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 26px; }
.interruptor { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.ajuste { padding: 20px 0; border-top: 1px solid var(--line); }
.ajuste h2 { font-size: 18px; margin-bottom: 6px; }
.ajuste p { margin: 0 0 12px; color: var(--ink-2); max-width: 65ch; }
.estado-almacen { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 12px; color: var(--ink-2); }
.estado-almacen i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: block; }
.estado-almacen.nube i { background: var(--ink); }
.recordatorio { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px dashed var(--ink-3); padding: 12px 16px; margin: -16px 0 20px; font-size: 14.5px; color: var(--ink-2); }
.recordatorio strong { color: var(--ink); }

.titulo-vista { font-size: 30px; margin-bottom: 6px; }
.intro-vista { color: var(--ink-2); margin: 0 0 24px; max-width: 65ch; }
footer.pie { max-width: 1080px; margin: 0 auto; padding: 0 20px 40px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--ink-3); font-size: 12.5px; }

/* Avisos */
.avisos { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(360px, calc(100vw - 32px)); }
.aviso { background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 2px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: flex; gap: 12px; align-items: baseline; animation: entra .25s ease-out; }
.aviso .mono { font-size: 12px; opacity: .7; white-space: nowrap; }
.aviso.nivel { font-size: 15px; }
.aviso.nivel b { font-family: var(--display); font-size: 20px; }
@keyframes entra { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .aviso { animation: none; } }

@media (max-width: 760px) {
  .portada, .hoja, .ochenta, .campos { grid-template-columns: minmax(0, 1fr); }
  .ochenta > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .fila { grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; }
  .fila .pips, .fila .rango { grid-column: 2; justify-self: start; }
  .sem-num { font-size: 40px; grid-row: auto; }
  .sem-cab { grid-template-columns: minmax(0, 1fr); }
  .sem-cab h1 { font-size: 26px; }
  .cab-xp .barra { width: 50px; }
  .nivel-num { font-size: 60px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cab-in { gap: 8px 16px; }
  .marca { flex: 1; }
  .nav { order: 3; flex-basis: 100%; margin: 0 -10px; }
  .saltos { position: static; }
  .sesion { scroll-margin-top: 110px; }
}

<script>
const TEMARIO = [{"n":0,"sesiones":{"construir":{"titulo":"Tu propio Check (sustituto de JUnit)","objetivo":"Crear una clase que te diga ✔ o ✘ al comprobar resultados, con mensajes claros cuando algo falla.","reto":"<p>Prepara el terreno y construye tu primera herramienta.<\/p><ol><li>Crea un proyecto Java 21 en IntelliJ <strong>sin Maven ni Gradle<\/strong> llamado <code>rotacion<\/code>, con los paquetes <code>herramientas<\/code>, <code>tracker<\/code> y <code>semana00<\/code>.<\/li><li>Desactiva la IA del IDE para las sesiones: en <em>Settings<\/em>, busca <strong>inline completion<\/strong> y desactiva la finalización de líneas completas (<em>Full Line Code Completion<\/em>), y también AI Assistant o Copilot si los tienes. El autocompletado clásico de nombres de métodos puede quedarse.<\/li><li>Crea <code>herramientas.Check<\/code> con estos métodos estáticos:<\/li><\/ol><pre><code class=\"lang-java\">public static void igual(Object esperado, Object real, String nombre)\npublic static void verdadero(boolean condicion, String nombre)\npublic static void resumen() // imprime \"12 pasadas, 1 fallida\"<\/code><\/pre><p>Cada comprobación imprime una línea. Si falla, la línea dice qué esperabas y qué obtuviste:<\/p><pre><code>✔ suma(2, 2)\n✘ suma(2, 3): esperaba 5, obtuve 6<\/code><\/pre><ol start=\"4\"><li>En <code>semana00.CheckDemo<\/code> escribe un <code>main<\/code> con 3 comprobaciones que pasen y 1 que falle a propósito.<\/li><\/ol>","hecho":["<code>CheckDemo<\/code> imprime 3 ✔, 1 ✘ con el mensaje esperado/obtenido y un resumen final.","<code>Check.igual(null, null, ...)<\/code> pasa sin lanzar <code>NullPointerException<\/code>.","Comparar dos <code>String<\/code> iguales creados por separado (<code>new String(\"a\")<\/code>) pasa."],"minima":"<p>Solo <code>igual<\/code> y <code>resumen<\/code>, sin formato bonito. Unos 15 minutos.<\/p>","pista1":"<p>Necesitas dos contadores <code>static int<\/code> dentro de <code>Check<\/code> (pasadas y fallidas). Cada método suma a uno de ellos y escribe su línea.<\/p>","pista2":"<p>Para comparar usa <code>java.util.Objects.equals(esperado, real)<\/code>: compara con <code>equals<\/code> y además maneja <code>null<\/code> en los dos lados. Si usas <code>==<\/code>, comparas direcciones de memoria, no contenido (lo verás a fondo en la semana 1).<\/p>","pista3":"<pre><code class=\"lang-java\">public final class Check {\n    private static int pasadas, fallidas;\n\n    public static void igual(Object esperado, Object real, String nombre) {\n        if (Objects.equals(esperado, real)) {\n            pasadas++;\n            System.out.println(\"✔ \" + nombre);\n        } else {\n            fallidas++;\n            System.out.println(\"✘ \" + nombre + \": esperaba \" + esperado + \", obtuve \" + real);\n        }\n    }\n    // verdadero(...) y resumen() siguen el mismo patrón\n}<\/code><\/pre>"},"medir":{"titulo":"Tu medidor de daño (Bench)","objetivo":"Construir una herramienta que mida cuánto tarda un trozo de código de forma fiable, y usarla para comparar <code>+=<\/code> con <code>StringBuilder<\/code>.","reto":"<p>Crea <code>herramientas.Tarea<\/code> (una interfaz con un único método <code>void ejecutar();<\/code>) y <code>herramientas.Bench<\/code> con:<\/p><pre><code class=\"lang-java\">public static void medir(String nombre, int calentamiento, int repeticiones, Tarea tarea)<\/code><\/pre><ul><li>Ejecuta la tarea <code>calentamiento<\/code> veces <strong>sin medir<\/strong> (para que el JIT compile el código).<\/li><li>Ejecuta <code>repeticiones<\/code> veces midiendo cada una con <code>System.nanoTime()<\/code>.<\/li><li>Imprime mínimo, mediana y máximo en milisegundos con 3 decimales.<\/li><\/ul><p>Como <code>Tarea<\/code> tiene un solo método, puedes pasarla como lambda: <code>Bench.medir(\"concat\", 3, 10, () -&gt; concatenar(20_000));<\/code><\/p><p><strong>Experimento:<\/strong> construir un <code>String<\/code> con los números de 0 a n usando <code>s += i<\/code> frente a <code>StringBuilder.append(i)<\/code>, con n = 10 000, 20 000 y 40 000. Apunta los 6 resultados en tu libreta.<\/p><p><strong>Trampa del optimizador:<\/strong> si el resultado no se usa, el JIT puede eliminar el código y medirás casi 0 ms. Guarda algo del resultado (por ejemplo, la longitud) en un campo <code>static long sumidero<\/code>.<\/p>","hecho":["<code>Bench<\/code> imprime algo como <code>concat n=20000 → min 41.2 · mediana 43.9 · max 60.1 ms<\/code>.","Tienes los 6 números apuntados en la libreta (en \"Mis números\").","Puedes decir cuántas veces más tarda <code>+=<\/code> cuando n se duplica."],"minima":"<p>Sin la clase <code>Bench<\/code>: mide una sola vez <code>+=<\/code> y <code>StringBuilder<\/code> con n = 20 000 usando <code>System.nanoTime()<\/code> antes y después, y apunta los dos números.<\/p>","pista1":"<p>La mediana es el valor central tras ordenar: guarda los tiempos en un <code>long[]<\/code>, usa <code>Arrays.sort<\/code> y coge el elemento <code>repeticiones / 2<\/code>. Es mejor que la media porque una pausa del recolector de basura no la estropea.<\/p>","pista2":"<p>Para pasar de nanosegundos a milisegundos con decimales: <code>nanos / 1_000_000.0<\/code> (fíjate en el <code>.0<\/code>: sin él es división entera). Para imprimir: <code>System.out.printf(\"%s → min %.3f ms%n\", nombre, min);<\/code><\/p>","pista3":"<p>Lo que deberías ver: con <code>+=<\/code> el tiempo se multiplica por unas 4 veces cada vez que n se duplica, y con <code>StringBuilder<\/code> por unas 2. Cada <code>+=<\/code> crea un <code>String<\/code> nuevo copiando todo el anterior, así que copias 1 + 2 + 3 + … + n trozos. Eso es crecimiento cuadrático, y en la semana 5 aprenderás a demostrarlo.<\/p>"},"aplicar":{"titulo":"Tracker v0: el diseño y la primera tabla","objetivo":"Decidir qué hará tu tracker al final del bootcamp e imprimir su primera tabla semanal por consola.","reto":"<p><strong>Parte 1. Documento de diseño (10 min).<\/strong> En <code>tracker/DISENO.md<\/code> escribe:<\/p><ul><li>Tus hábitos y <strong>cómo se mide cada uno<\/strong>: dientes (sí/no, todos los días), gym (sí/no, objetivo 4 días por semana), dormir (horas, media ≥ 7 h), comer bien (sí/no, objetivo 5 días)… y los que quieras añadir.<\/li><li>5 preguntas que quieres que el tracker te responda en el futuro (por ejemplo: \"¿cuál es mi racha actual de gym?\").<\/li><\/ul><p><strong>Parte 2. La tabla (20 min).<\/strong> En <code>tracker.Main<\/code>, con un <code>String[] habitos<\/code> y un <code>boolean[][] hecho<\/code> (filas = hábitos, columnas = días) con datos inventados, imprime:<\/p><pre><code>Hábito        L  M  X  J  V  S  D   Total\nDientes       ✔  ✔  ·  ✔  ✔  ✔  ✔   6/7\nGym           ✔  ·  ✔  ·  ✔  ·  ·   3/7\nComer bien    ✔  ✔  ✔  ·  ✔  ✔  ·   5/7<\/code><\/pre><p>Guarda una copia de esta salida: en la semana 16 la misma tabla saldrá de tu propia API REST.<\/p>","hecho":["<code>DISENO.md<\/code> existe con los hábitos, cómo se mide cada uno y 5 preguntas.","La tabla sale alineada aunque los nombres tengan longitudes distintas.","La columna Total se calcula, no está escrita a mano."],"minima":"<p>Solo la tabla, sin el documento de diseño (lo puedes hacer otro día).<\/p>","pista1":"<p>Recorre con dos bucles anidados: el de fuera para cada hábito (fila) y el de dentro para cada día (columna). Ve contando los <code>true<\/code> de la fila para el total.<\/p>","pista2":"<p>Para alinear usa <code>printf<\/code> con ancho fijo: <code>%-12s<\/code> imprime un texto ocupando 12 caracteres, alineado a la izquierda. Ejemplo: <code>System.out.printf(\"%-12s\", habitos[i]);<\/code><\/p>","pista3":"<pre><code class=\"lang-java\">for (int i = 0; i &lt; habitos.length; i++) {\n    System.out.printf(\"%-12s\", habitos[i]);\n    int total = 0;\n    for (int d = 0; d &lt; 7; d++) {\n        System.out.print(hecho[i][d] ? \"  ✔\" : \"  ·\");\n        if (hecho[i][d]) total++;\n    }\n    System.out.printf(\"   %d/7%n\", total);\n}<\/code><\/pre>"},"explica":{"reto":"<p>Explícale a un compañero por qué medir una sola vez con <code>System.nanoTime()<\/code> puede mentirte, y cómo lo resuelve tu <code>Bench<\/code>.<\/p>","guia":["Qué hace el JIT con el código que se ejecuta muchas veces (del intérprete a código compilado).","Por qué la primera ejecución suele ser la más lenta.","Por qué usas la mediana y no la media.","Qué es la trampa del optimizador y para qué sirve tu <code>sumidero<\/code>."]}},"bloque":0,"titulo":"Tutorial: tu banco de pruebas","resumen":"Antes de entrar en el juego montas tus herramientas: un sistema de comprobaciones propio y tu medidor de daño. Las usarás todas las semanas.","sabes":["Crear clases, métodos estáticos y bucles.","Usar el IDE y ejecutar un <code>main<\/code>."],"nuevo":["Medir tiempos con <code>System.nanoTime<\/code> sin engañarte (calentamiento del JIT).","Comprobar tu código sin JUnit, con una clase tuya.","Implementar una interfaz de un solo método con una lambda."],"objetivos":["Tener un proyecto <code>rotacion<\/code> con los paquetes <code>herramientas<\/code> y <code>tracker<\/code>.","Poder escribir <code>Check.igual(4, suma(2, 2), \"suma\")<\/code> y ver ✔ o ✘.","Saber por qué la primera medición de un programa Java casi siempre miente."],"tracker":"Documento de diseño del tracker y la tabla semanal impresa por consola (versión 0, con datos inventados)."},{"n":1,"sesiones":{"construir":{"titulo":"Habito y Registro: objetos que no pueden romperse","objetivo":"Crear las dos clases base del tracker de forma que sea imposible construirlas con datos inválidos.","reto":"<p>En el paquete <code>tracker<\/code> crea:<\/p><p><strong><code>Habito<\/code><\/strong> (inmutable: todos los campos <code>private final<\/code>, sin setters):<\/p><ul><li><code>id<\/code> (String), <code>nombre<\/code> (String), <code>tipo<\/code> (enum <code>TipoMedida { SI_NO, CANTIDAD }<\/code>), <code>objetivoSemanal<\/code> (int).<\/li><li>El constructor lanza <code>IllegalArgumentException<\/code> con un mensaje útil si el nombre es nulo, está en blanco o supera 30 caracteres, o si el objetivo no está entre 1 y 7.<\/li><li>Guarda el nombre sin espacios sobrantes (<code>trim<\/code>).<\/li><li>Método <code>conObjetivo(int nuevo)<\/code> que <strong>devuelve un <code>Habito<\/code> nuevo<\/strong> en lugar de modificar el actual.<\/li><li>Getters con estilo moderno: <code>nombre()<\/code> en lugar de <code>getNombre()<\/code> (es el estilo de los records de Java, que verás en la semana 12).<\/li><\/ul><p><strong><code>Registro<\/code><\/strong> (inmutable): <code>habitoId<\/code>, <code>fecha<\/code> (<code>java.time.LocalDate<\/code>) y <code>valor<\/code> (double: 1 o 0 para sí/no, horas para dormir). Lanza excepción si el valor es negativo o la fecha es nula.<\/p><p>Con tu <code>Check<\/code>, escribe al menos 6 comprobaciones en <code>semana01.PruebasHabito<\/code>, incluidos casos que <strong>deben<\/strong> lanzar excepción.<\/p>","hecho":["<code>new Habito(\"h1\", \"  \", ...)<\/code> lanza una excepción con un mensaje claro.","<code>conObjetivo(5)<\/code> devuelve otro objeto y el original no cambia (compruébalo).","Tienes al menos 6 checks y todos pasan."],"minima":"<p>Solo <code>Habito<\/code> con la validación del nombre y del objetivo, y 3 checks.<\/p>","pista1":"<p>Un invariante es una regla que se cumple siempre durante la vida del objeto. Si los campos son <code>final<\/code> y el constructor es la única puerta de entrada, basta con validar en el constructor: una vez creado, el objeto ya no puede volverse inválido.<\/p>","pista2":"<pre><code class=\"lang-java\">if (nombre == null || nombre.isBlank())\n    throw new IllegalArgumentException(\"El nombre no puede estar vacío\");\nif (objetivoSemanal &lt; 1 || objetivoSemanal &gt; 7)\n    throw new IllegalArgumentException(\"Objetivo fuera de rango (1-7): \" + objetivoSemanal);<\/code><\/pre><p>Para <code>conObjetivo<\/code>: <code>return new Habito(id, nombre, tipo, nuevo);<\/code>. Así reutilizas la validación del constructor.<\/p>","pista3":"<p>Para comprobar que algo lanza excepción con tu <code>Check<\/code>:<\/p><pre><code class=\"lang-java\">try {\n    new Habito(\"h1\", \"\", TipoMedida.SI_NO, 3);\n    Check.verdadero(false, \"nombre vacío debería fallar\");\n} catch (IllegalArgumentException e) {\n    Check.verdadero(true, \"nombre vacío falla: \" + e.getMessage());\n}<\/code><\/pre>"},"medir":{"titulo":"¿Cuánto pesa un objeto?","objetivo":"Medir con tus propios números la diferencia de memoria y velocidad entre <code>int[]<\/code> e <code>Integer[]<\/code>, y descubrir la caché de Integer.","reto":"<p><strong>Experimento 1: memoria.<\/strong> Mide cuánta memoria ocupan:<\/p><ul><li><code>int[1_000_000]<\/code> relleno con 0..n<\/li><li><code>Integer[1_000_000]<\/code> relleno con <code>Integer.valueOf(i)<\/code><\/li><li><code>ArrayList&lt;Integer&gt;<\/code> con 1 000 000 de elementos<\/li><\/ul><p>Usa <code>Runtime rt = Runtime.getRuntime();<\/code> y la memoria usada, <code>rt.totalMemory() - rt.freeMemory()<\/code>, antes y después de crear cada estructura. Calcula <strong>bytes por elemento<\/strong>.<\/p><p><strong>Experimento 2: velocidad.<\/strong> Con tu <code>Bench<\/code>, suma todos los elementos del <code>int[]<\/code> y del <code>Integer[]<\/code>. ¿Cuántas veces más lento es el segundo?<\/p><p><strong>Experimento 3: mecánica oculta.<\/strong> Ejecuta esto e intenta explicar el resultado antes de abrir las pistas:<\/p><pre><code class=\"lang-java\">Integer a = 127, b = 127;\nInteger c = 128, d = 128;\nSystem.out.println(a == b); // ?\nSystem.out.println(c == d); // ?<\/code><\/pre>","hecho":["Tienes los bytes por elemento de las 3 estructuras apuntados en la libreta.","Sabes cuántas veces más lento es sumar un <code>Integer[]<\/code>.","Sabes explicar por qué <code>a == b<\/code> es true y <code>c == d<\/code> es false."],"minima":"<p>Solo el experimento 1 con <code>int[]<\/code> frente a <code>Integer[]<\/code>, apuntando los MB.<\/p>","pista1":"<p>Llama a <code>System.gc()<\/code> antes de cada lectura de memoria para reducir el ruido (es una sugerencia a la JVM, no una orden: repite la medición 3 veces). Y usa el array <strong>después<\/strong> de medir (imprime su longitud, por ejemplo): si no, la JVM puede liberarlo antes de tiempo.<\/p>","pista2":"<p>Lo esperable en una JVM de 64 bits normal: un <code>int<\/code> ocupa 4 bytes. Un <code>Integer<\/code> es un objeto: 12 bytes de cabecera + 4 del valor = 16 bytes, más los 4 bytes de la referencia en el array. Unos 20 bytes frente a 4: ×5. En velocidad, cada acceso al <code>Integer[]<\/code> es un salto a otra zona de memoria.<\/p>","pista3":"<p><code>Integer a = 127<\/code> usa por debajo <code>Integer.valueOf(127)<\/code>, que devuelve objetos <strong>cacheados<\/strong> entre -128 y 127. Por eso <code>a<\/code> y <code>b<\/code> son el mismo objeto (<code>==<\/code> compara referencias). 128 está fuera de la caché: son dos objetos distintos con el mismo valor. Moraleja: con objetos, compara siempre con <code>equals<\/code>.<\/p>"},"aplicar":{"titulo":"El bug del duplicado","objetivo":"Construir un catálogo de hábitos sin duplicados y entender qué pasa dentro de un <code>HashSet<\/code> cuando <code>equals<\/code> y <code>hashCode<\/code> fallan.","reto":"<p><strong>Parte 1. Reproduce el bug.<\/strong> Crea dos <code>Habito<\/code> con el mismo nombre (\"Gym\") y distinto id, y mételos en un <code>HashSet<\/code> <strong>sin<\/strong> haber sobrescrito <code>equals<\/code> ni <code>hashCode<\/code>. ¿Cuántos elementos tiene el set?<\/p><p><strong>Parte 2. Decide la identidad.<\/strong> En el tracker, dos hábitos son el mismo si tienen el mismo nombre sin importar mayúsculas ni espacios (\"Gym\" = \" gym \"). Implementa <code>equals<\/code> y <code>hashCode<\/code> según esa regla.<\/p><p><strong>Parte 3. Rompe un HashSet a propósito.<\/strong> Crea una clase <code>HabitoMutable<\/code> con un <code>setNombre<\/code> y <code>equals<\/code>/<code>hashCode<\/code> basados en el nombre. Métela en un <code>HashSet<\/code>, cambia su nombre y comprueba <code>set.contains(h)<\/code>. Explica el resultado.<\/p><p><strong>Parte 4. Pieza del tracker.<\/strong> <code>CatalogoHabitos<\/code> con <code>agregar(Habito)<\/code> (lanza excepción si ya existe uno con el mismo nombre normalizado), <code>buscarPorNombre(String)<\/code> y <code>todos()<\/code>.<\/p>","hecho":["El set de la parte 1 tiene 2 elementos; después de la parte 2 tiene 1.","En la parte 3, <code>contains<\/code> devuelve false aunque el objeto <strong>está dentro<\/strong> del set, y sabes por qué.","<code>CatalogoHabitos<\/code> rechaza \"GYM\" si ya existe \"Gym\" (con un check)."],"minima":"<p>Solo las partes 1 y 2.<\/p>","pista1":"<p>Un <code>HashSet<\/code> primero usa <code>hashCode()<\/code> para elegir una \"cubeta\" y luego compara con <code>equals()<\/code> solo dentro de esa cubeta. Si dos objetos son iguales según <code>equals<\/code> pero dan un <code>hashCode<\/code> distinto, caen en cubetas distintas y el set nunca llega a compararlos.<\/p>","pista2":"<p>Calcula una vez en el constructor una clave normalizada, <code>nombre.trim().toLowerCase()<\/code>, y guárdala en un campo <code>final<\/code>. Usa ese campo en <code>equals<\/code> y en <code>hashCode<\/code> (<code>clave.hashCode()<\/code>). Así los dos métodos usan exactamente la misma regla.<\/p>","pista3":"<p>En la parte 3, el objeto se guardó en la cubeta calculada con el nombre <strong>viejo<\/strong>. Al cambiar el nombre, <code>contains<\/code> calcula el hash del nombre <strong>nuevo<\/strong> y busca en otra cubeta, donde no está. El objeto se queda \"perdido\" dentro del set. Por eso las claves de un <code>HashSet<\/code> o un <code>HashMap<\/code> deberían ser inmutables, y por eso tu <code>Habito<\/code> lo es.<\/p>"},"explica":{"reto":"<p>Explícale a un compañero qué hay realmente dentro de una variable <code>Habito h<\/code>, y por qué <code>h1 == h2<\/code> puede ser false aunque los dos tengan exactamente los mismos datos. Bonus: por qué <code>Integer a = 128, b = 128; a == b<\/code> da false.<\/p>","guia":["Qué vive en el stack y qué vive en el heap.","Qué es una referencia, y qué compara <code>==<\/code>.","Qué compara <code>equals<\/code> y quién decide qué significa \"igual\".","La caché de <code>Integer<\/code> como ejemplo de la trampa."]}},"bloque":1,"titulo":"Objetos por dentro: memoria e invariantes","resumen":"Ya sabes escribir clases. Esta semana ves qué ocurre en memoria cuando creas un objeto y por qué un objeto bien diseñado no puede quedar en un estado inválido.","sabes":["Escribir una clase con constructor, getters, <code>equals<\/code>, <code>hashCode<\/code> y <code>toString<\/code>.","Usar <code>List<\/code> y <code>Set<\/code>."],"nuevo":["Stack frente a heap: qué guarda realmente una variable de tipo objeto.","Invariantes e inmutabilidad: objetos que no pueden ser inválidos.","Cuánto pesa un objeto frente a un primitivo (boxing).","Qué pasa dentro de un <code>HashSet<\/code> cuando <code>equals<\/code> y <code>hashCode<\/code> no cuadran."],"objetivos":["Dibujar en papel el stack y el heap de un programa de 10 líneas.","Hacer imposible crear un <code>Habito<\/code> inválido.","Saber cuántos bytes ocupa un <code>Integer<\/code> frente a un <code>int<\/code>, con tu propia medición."],"tracker":"<code>Habito<\/code> y <code>Registro<\/code> inmutables con validación, y <code>CatalogoHabitos<\/code> sin duplicados."},{"n":2,"sesiones":{"construir":{"titulo":"La interfaz Objetivo","objetivo":"Modelar las reglas de cada hábito (todos los días, N días, media mínima…) como implementaciones de una interfaz.","reto":"<p>En <code>tracker<\/code>, crea:<\/p><pre><code class=\"lang-java\">public interface Objetivo {\n    boolean cumplido(List&lt;Registro&gt; semana);\n    String describir(); // \"4 días por semana\"\n}<\/code><\/pre><p>Implementaciones:<\/p><ul><li><code>DiasMinimos(int n)<\/code>: al menos n días con valor &gt; 0 (gym: 4).<\/li><li><code>Diario<\/code>: los 7 días (dientes).<\/li><li><code>MediaMinima(double minimo)<\/code>: la media de los valores es ≥ mínimo (dormir: 7.0).<\/li><li><code>MaximoDias(int n)<\/code>: como mucho n días con valor &gt; 0 (comida basura: 2).<\/li><\/ul><p>Cambia <code>Habito<\/code> para que tenga un <code>Objetivo<\/code> en lugar del <code>int objetivoSemanal<\/code>. Fíjate: el hábito <strong>tiene<\/strong> un objetivo (composición), no <strong>es<\/strong> un tipo de hábito (herencia).<\/p><p>Escribe checks con semanas de prueba inventadas para cada implementación.<\/p>","hecho":["Las 4 implementaciones tienen al menos 2 checks cada una (una semana que cumple y otra que no).","<code>Habito<\/code> ya no tiene <code>objetivoSemanal<\/code>: tiene un <code>Objetivo<\/code>.","No hay ningún <code>instanceof<\/code> ni if/else por tipo de hábito."],"minima":"<p>La interfaz con <code>DiasMinimos<\/code> y <code>Diario<\/code>, y 2 checks.<\/p>","pista1":"<p>Cada implementación solo responde a una pregunta: ¿esta semana cuenta? Recorre la lista, cuenta o suma, y compara con su parámetro. El parámetro (n, mínimo) se guarda en un campo <code>final<\/code> desde el constructor.<\/p>","pista2":"<p><code>Diario<\/code> es un caso particular de <code>DiasMinimos(7)<\/code>. Puedes reutilizarla <strong>por composición<\/strong>: un campo <code>private final Objetivo base = new DiasMinimos(7);<\/code> y <code>cumplido<\/code> delega en <code>base.cumplido(semana)<\/code>. Otra opción válida: no crear la clase y usar directamente <code>new DiasMinimos(7)<\/code>. Elige y apunta por qué.<\/p>","pista3":"<pre><code class=\"lang-java\">public final class DiasMinimos implements Objetivo {\n    private final int n;\n    public DiasMinimos(int n) { this.n = n; }\n\n    public boolean cumplido(List&lt;Registro&gt; semana) {\n        int dias = 0;\n        for (Registro r : semana) if (r.valor() &gt; 0) dias++;\n        return dias &gt;= n;\n    }\n    public String describir() { return n + \" días por semana\"; }\n}<\/code><\/pre>"},"medir":{"titulo":"¿Cuesta algo el polimorfismo?","objetivo":"Medir el coste de una llamada a través de una interfaz cuando hay 1, 2 o 4 implementaciones distintas en el mismo punto del código.","reto":"<p>Crea una interfaz mínima para aislar el coste de la llamada:<\/p><pre><code class=\"lang-java\">interface Calc { int aplicar(int x); }<\/code><\/pre><p>y 4 implementaciones triviales (<code>x + 1<\/code>, <code>x * 2<\/code>, <code>x - 3<\/code>, <code>x ^ 5<\/code>).<\/p><p>Prepara un <code>Calc[] calcs<\/code> de 1024 posiciones para cada escenario:<\/p><ul><li><strong>Monomórfico<\/strong>: las 1024 son la misma implementación.<\/li><li><strong>Bimórfico<\/strong>: alternan 2 implementaciones.<\/li><li><strong>Megamórfico<\/strong>: rotan las 4.<\/li><\/ul><p>Bucle de medición (10 millones de llamadas):<\/p><pre><code class=\"lang-java\">long total = 0;\nfor (int i = 0; i &lt; 10_000_000; i++) total += calcs[i &amp; 1023].aplicar(i);\nsumidero += total;<\/code><\/pre><p>Mide los 3 escenarios con tu <code>Bench<\/code> y calcula <strong>nanosegundos por llamada<\/strong>. Extra: compáralo con un <code>switch<\/code> sobre un enum que hace lo mismo.<\/p>","hecho":["Tienes los ns por llamada de los 3 escenarios en la libreta.","Sabes en cuál de ellos el JIT no puede hacer inlining.","Tienes una conclusión de una frase: ¿importa este coste en tu tracker?"],"minima":"<p>Solo monomórfico frente a megamórfico.<\/p>","pista1":"<p><code>i &amp; 1023<\/code> es lo mismo que <code>i % 1024<\/code> cuando 1024 es potencia de 2, pero más barato. Lo verás otra vez en los mapas hash (semana 8).<\/p>","pista2":"<p>El calentamiento es clave: el JIT observa qué clases llegan a cada llamada (el \"perfil de tipos\") y después decide. Si solo ve 1 o 2 clases, copia el cuerpo del método dentro del bucle (inlining) y la llamada desaparece. Con 3 o más, tiene que buscar el método en una tabla en cada llamada.<\/p>","pista3":"<p>Lo esperable: mono y bi alrededor de 1 ns por llamada, y mega entre 2 y 4 veces más. Si todos dan igual, revisa que usas el resultado (sumidero) y que haces calentamiento. Conclusión típica: el polimorfismo no se elige por velocidad sino por <strong>coste de cambio<\/strong>, y su coste solo importa en bucles de millones de iteraciones.<\/p>"},"aplicar":{"titulo":"Refactoriza el monstruo if/else","objetivo":"Sustituir una cadena de if/else por polimorfismo y comprobar que añadir un tipo nuevo ya no obliga a tocar el código existente.","reto":"<p>Copia este código (es el típico que te encuentras en un proyecto real):<\/p><pre><code class=\"lang-java\">public class EvaluadorFeo {\n    public boolean cumplido(String tipo, List&lt;Registro&gt; semana) {\n        int dias = 0; double suma = 0;\n        for (Registro r : semana) { if (r.valor() &gt; 0) dias++; suma += r.valor(); }\n        if (tipo.equals(\"gym\")) return dias &gt;= 4;\n        else if (tipo.equals(\"dientes\")) return dias == 7;\n        else if (tipo.equals(\"dormir\")) return suma / semana.size() &gt;= 7.0;\n        else if (tipo.equals(\"basura\")) return dias &lt;= 2;\n        throw new IllegalArgumentException(\"Tipo desconocido: \" + tipo);\n    }\n}<\/code><\/pre><ol><li>Añade el tipo \"agua\" (media ≥ 2 litros) a <code>EvaluadorFeo<\/code>. Apunta cuántas líneas y archivos has tocado.<\/li><li>Ahora hazlo con tu <code>Objetivo<\/code>: ¿cuántas clases existentes has tenido que modificar?<\/li><li>Crea <code>InformeSemanal<\/code> que, dados los hábitos y los registros de una semana, imprime la tabla de la semana 0 más una columna <code>Objetivo<\/code> (✔/✘) con la descripción del objetivo, sin ningún if por tipo.<\/li><\/ol>","hecho":["\"Agua\" funciona sin modificar ninguna clase que ya existía.","La tabla muestra ✔/✘ por hábito usando <code>habito.objetivo().cumplido(...)<\/code>.","Has apuntado la comparación de líneas y archivos tocados en las dos versiones."],"minima":"<p>Solo el paso 2 con \"agua\".<\/p>","pista1":"<p>\"Agua, media ≥ 2\" ya existe: es <code>new MediaMinima(2.0)<\/code>. A veces añadir un tipo nuevo no requiere ni una clase nueva, solo una combinación nueva de piezas. Esa es la ventaja de la composición.<\/p>","pista2":"<p>Para el informe: agrupa los registros de la semana por <code>habitoId<\/code> (por ahora con un bucle y una lista por hábito; en la semana 8 lo harás con tu propio mapa) y llama a <code>objetivo().cumplido(registrosDelHabito)<\/code>.<\/p>","pista3":"<p>El principio que acabas de aplicar es <strong>abierto/cerrado<\/strong>: el código está abierto a extensión (nuevas implementaciones) y cerrado a modificación (no tocas lo que ya funciona). En <code>EvaluadorFeo<\/code>, cada tipo nuevo obliga a editar el mismo método, que es justo donde se cuelan los bugs.<\/p>"},"explica":{"reto":"<p>¿Por qué tu tracker usa una interfaz <code>Objetivo<\/code> en lugar de una clase padre <code>HabitoBase<\/code> con subclases <code>HabitoGym<\/code>, <code>HabitoDientes<\/code>…? ¿Quién decide qué método <code>cumplido<\/code> se ejecuta, y en qué momento?<\/p>","guia":["Composición (\"tiene un\") frente a herencia (\"es un\"): ¿qué pasa si el gym pasa de \"4 días\" a \"media de 60 minutos\"?","Despacho dinámico: la decisión se toma en ejecución, mirando el objeto real.","Lo que hace el JIT con 1, 2 o muchas implementaciones (tus números).","Abierto/cerrado con el ejemplo del agua."]}},"bloque":1,"titulo":"Interfaces y polimorfismo: el porqué","resumen":"Ya sabes usar interfaces. Esta semana descubres por qué existen: cómo decide Java qué método ejecutar, cuánto cuesta y por qué se prefiere la composición a la herencia.","sabes":["Declarar una interfaz y varias implementaciones.","Usar una lista del tipo de la interfaz (polimorfismo)."],"nuevo":["Despacho dinámico: la JVM elige el método en tiempo de ejecución.","Composición frente a herencia.","Principio abierto/cerrado: añadir comportamiento sin tocar código que ya funciona.","Qué hace el JIT con una llamada polimórfica (inlining)."],"objetivos":["Que cada hábito tenga su propia regla de \"objetivo cumplido\" sin ningún if/else por tipo.","Añadir un tipo de objetivo nuevo sin modificar ninguna clase existente.","Saber, con números, cuándo una llamada polimórfica cuesta algo y cuándo no."],"tracker":"Interfaz <code>Objetivo<\/code> con 4 reglas distintas, e <code>InformeSemanal<\/code> que dice si cada hábito ha cumplido."},{"n":3,"sesiones":{"construir":{"titulo":"Par&lt;A, B&gt; y Rango&lt;T&gt;","objetivo":"Escribir dos clases genéricas propias y entender los límites de tipo.","reto":"<ol><li><strong>Calentamiento (5 min):<\/strong> <code>Par&lt;A, B&gt;<\/code> inmutable con <code>primero()<\/code> y <code>segundo()<\/code>.<\/li><li><strong><code>Rango&lt;T extends Comparable&lt;T&gt;&gt;<\/code><\/strong> con <code>desde<\/code> y <code>hasta<\/code> (ambos incluidos):<ul><li>El constructor lanza excepción si <code>desde &gt; hasta<\/code> (usa <code>compareTo<\/code>).<\/li><li><code>boolean contiene(T valor)<\/code><\/li><li><code>boolean seSolapa(Rango&lt;T&gt; otro)<\/code><\/li><\/ul><\/li><li>Pruébalo con <code>Rango&lt;Integer&gt;<\/code> y con <code>Rango&lt;Double&gt;<\/code> (horas de sueño sanas: de 7.0 a 9.0).<\/li><li><strong>Jefe de la sesión:<\/strong> ahora prueba <code>Rango&lt;LocalDate&gt;<\/code> para representar una semana. <strong>No va a compilar.<\/strong> Es intencionado: lee el error e intenta entender por qué antes de abrir la pista 3.<\/li><\/ol>","hecho":["<code>Par<\/code> y <code>Rango<\/code> funcionan con al menos 2 tipos distintos (con checks).","<code>Rango&lt;LocalDate&gt;<\/code> compila y <code>contiene<\/code> funciona con fechas.","Puedes explicar en una frase qué significa <code>? super T<\/code>."],"minima":"<p>Solo <code>Rango&lt;T&gt;<\/code> con <code>contiene<\/code>, probado con <code>Integer<\/code> y <code>Double<\/code>.<\/p>","pista1":"<p>Declarar una clase genérica es poner <code>&lt;T&gt;<\/code> tras el nombre: <code>public final class Par&lt;A, B&gt; { private final A primero; ... }<\/code>. Dentro de la clase, <code>A<\/code> y <code>B<\/code> se usan como cualquier otro tipo.<\/p>","pista2":"<p><code>&lt;T extends Comparable&lt;T&gt;&gt;<\/code> significa \"cualquier T que sepa compararse con otro T\". Gracias a eso puedes escribir <code>desde.compareTo(valor) &lt;= 0 &amp;&amp; valor.compareTo(hasta) &lt;= 0<\/code>. Dos rangos se solapan si <code>this.desde &lt;= otro.hasta<\/code> y <code>otro.desde &lt;= this.hasta<\/code>.<\/p>","pista3":"<p><code>LocalDate<\/code> no implementa <code>Comparable&lt;LocalDate&gt;<\/code> sino <code>Comparable&lt;ChronoLocalDate&gt;<\/code> (lo hereda de una interfaz padre). El límite <code>T extends Comparable&lt;T&gt;<\/code> exige exactamente <code>Comparable&lt;LocalDate&gt;<\/code>, así que falla. La solución es <code>&lt;T extends Comparable&lt;? super T&gt;&gt;<\/code>: \"T sabe compararse con T <strong>o con algún supertipo de T<\/strong>\". Es lo mismo que usa la propia JDK en <code>Collections.sort<\/code>.<\/p>"},"medir":{"titulo":"Datamining: el precio del borrado de tipos","objetivo":"Ver en el bytecode qué queda de T y medir cuánto cuesta el autoboxing en una clase genérica frente a una versión con primitivos.","reto":"<p><strong>Parte 1. Datamining.<\/strong> Abre el bytecode de <code>Rango<\/code> (en IntelliJ: cursor sobre la clase y <em>View → Show Bytecode<\/em>, o <code>javap -c -p Rango.class<\/code> en la terminal). Busca:<\/p><ul><li>¿Qué tipo tienen los campos <code>desde<\/code> y <code>hasta<\/code>?<\/li><li>¿Qué método se llama exactamente en <code>contiene<\/code>?<\/li><li>¿Aparece alguna instrucción <code>checkcast<\/code>?<\/li><\/ul><p><strong>Parte 2. Medición.<\/strong> Crea <code>RangoInt<\/code> (igual pero con <code>int desde, hasta<\/code>). Con tu <code>Bench<\/code>, haz 10 millones de llamadas <code>contiene(i)<\/code>, con <code>i<\/code> de tipo <code>int<\/code>, en:<\/p><ul><li><code>Rango&lt;Integer&gt;<\/code><\/li><li><code>RangoInt<\/code><\/li><\/ul><p>Calcula los ns por llamada y cuántas veces más lento es el genérico.<\/p>","hecho":["Sabes qué tipo tienen los campos en el bytecode (pista: no es T).","Tienes los dos tiempos y la proporción en la libreta.","Sabes explicar de dónde sale la diferencia."],"minima":"<p>Solo la parte 1: abrir el bytecode y responder a las 3 preguntas.<\/p>","pista1":"<p>En el bytecode, los campos son <code>Comparable<\/code> (el límite de T) y <code>contiene<\/code> llama a <code>Comparable.compareTo(Object)<\/code>. T solo existe para el compilador: comprueba los tipos y luego lo borra. Esto se llama <strong>type erasure<\/strong>.<\/p>","pista2":"<p>Cuando llamas a <code>rango.contiene(i)<\/code> con un <code>int<\/code>, Java inserta por ti <code>Integer.valueOf(i)<\/code>: es el autoboxing. Para valores fuera de -128..127, eso significa crear un objeto en cada llamada. <code>RangoInt<\/code> compara dos ints directamente, sin objetos.<\/p>","pista3":"<p>Si la diferencia te sale pequeña, el JIT puede estar aplicando <strong>escape analysis<\/strong>: detecta que el <code>Integer<\/code> no sale del método y evita crearlo. Prueba a guardar los <code>Integer<\/code> en un array antes de medir (<code>Integer[] valores<\/code>) para obligar a que existan. Diferencias de 2× a 10× son normales.<\/p>"},"aplicar":{"titulo":"Consultas genéricas sobre tus registros","objetivo":"Usar <code>Rango<\/code>, <code>Par<\/code> y un método genérico propio para responder preguntas reales sobre los registros del tracker.","reto":"<ol><li>Crea tu interfaz <code>Filtro&lt;T&gt; { boolean acepta(T t); }<\/code> y el método genérico:<\/li><\/ol><pre><code class=\"lang-java\">public static &lt;T&gt; List&lt;T&gt; filtrar(List&lt;T&gt; lista, Filtro&lt;T&gt; filtro)<\/code><\/pre><ol start=\"2\"><li>Crea una lista de unos 30 <code>Registro<\/code> inventados (dos semanas de gym, dientes y dormir).<\/li><li>Responde usando <code>filtrar<\/code> con lambdas y <code>Rango<\/code>:<ul><li>¿Qué registros de gym hay en la semana del lunes 7 al domingo 13 de diciembre de 2026?<\/li><li>¿Qué noches dormiste fuera del rango sano de 7 a 9 h?<\/li><li>¿Cuál fue la peor noche? Devuélvela como <code>Par&lt;LocalDate, Double&gt;<\/code>.<\/li><\/ul><\/li><\/ol>","hecho":["<code>filtrar<\/code> funciona con <code>List&lt;Registro&gt;<\/code> y también con <code>List&lt;String&gt;<\/code> (pruébalo).","Las 3 preguntas tienen respuesta con checks.","No hay ningún <code>for<\/code> repetido para filtrar: todo pasa por <code>filtrar<\/code>."],"minima":"<p><code>filtrar<\/code> y la primera pregunta.<\/p>","pista1":"<p>En un método genérico, el <code>&lt;T&gt;<\/code> va <strong>antes<\/strong> del tipo de retorno: <code>public static &lt;T&gt; List&lt;T&gt; filtrar(...)<\/code>. Dentro: crea una lista vacía, recorre la de entrada y añade los elementos que cumplan <code>filtro.acepta(x)<\/code>.<\/p>","pista2":"<p>Una lambda es una implementación rápida de una interfaz con un solo método: <code>filtrar(registros, r -&gt; r.habitoId().equals(\"gym\"))<\/code>. Java sabe que <code>r<\/code> es un <code>Registro<\/code> porque la lista es <code>List&lt;Registro&gt;<\/code>.<\/p>","pista3":"<p>Para la segunda pregunta: <code>Rango&lt;Double&gt; sano = new Rango&lt;&gt;(7.0, 9.0);<\/code> y después <code>filtrar(registrosSueno, r -&gt; !sano.contiene(r.valor()))<\/code>. Para la peor noche, recorre una vez guardando el mínimo y crea el <code>Par<\/code> al final.<\/p>"},"explica":{"reto":"<p>Explica qué es el borrado de tipos (type erasure). Usa como ejemplo por qué <code>new T[10]<\/code> no compila dentro de una clase genérica, y qué guarda realmente un <code>List&lt;Integer&gt;<\/code> en memoria.<\/p>","guia":["T existe para el compilador, no para la JVM: tu bytecode lo demuestra.","Si en ejecución T no existe, ¿cómo iba a saber la JVM de qué tipo crear el array?","<code>List&lt;Integer&gt;<\/code> guarda referencias a objetos <code>Integer<\/code>, nunca ints (tus números de las semanas 1 y 3).","Pista para la semana que viene: así es como <code>ArrayList<\/code> crea su array interno."]}},"bloque":1,"titulo":"Genéricos: escribe tus propios &lt;T&gt;","resumen":"Llevas tiempo usando List&lt;String&gt; sin escribir nunca una clase genérica. Esta semana escribes las tuyas, y entiendes qué queda de T cuando el programa se ejecuta.","sabes":["Usar <code>List&lt;String&gt;<\/code>, <code>Map&lt;String, Integer&gt;<\/code> y similares.","Interfaces e implementaciones (semana 2)."],"nuevo":["Declarar clases y métodos genéricos: <code>class Rango&lt;T&gt;<\/code>, <code>static &lt;T&gt; List&lt;T&gt; filtrar(...)<\/code>.","Límites de tipo: <code>&lt;T extends Comparable&lt;? super T&gt;&gt;<\/code>.","Borrado de tipos (type erasure): T desaparece al compilar.","Lambdas como implementación rápida de una interfaz de un método."],"objetivos":["Escribir una clase genérica que funcione igual con fechas y con números.","Entender por qué <code>Rango&lt;LocalDate&gt;<\/code> no compila con el límite \"obvio\", y arreglarlo.","Ver con tus propios ojos el bytecode de una clase genérica."],"tracker":"<code>Rango&lt;T&gt;<\/code>, <code>Par&lt;A, B&gt;<\/code> y <code>Consultas.filtrar<\/code> para responder preguntas sobre tus registros."},{"n":4,"sesiones":{"construir":{"titulo":"MiLista&lt;T&gt;, tu propio ArrayList","objetivo":"Implementar una lista dinámica genérica sobre un array que crece cuando se llena.","reto":"<p>Crea <code>estructuras.MiLista&lt;T&gt;<\/code> con un <code>Object[] datos<\/code> (capacidad inicial 4) y un <code>int tamano<\/code>:<\/p><pre><code class=\"lang-java\">void add(T x)                 // al final; si está lleno, duplica la capacidad\nvoid add(int indice, T x)     // inserta desplazando a la derecha\nT get(int indice)\nT set(int indice, T x)        // devuelve el valor anterior\nT remove(int indice)          // desplaza a la izquierda y devuelve el eliminado\nint indexOf(T x)              // -1 si no está (usa equals)\nint size()\nint capacidad()               // datos.length, para tus pruebas\nlong copias()                 // total de elementos copiados al crecer<\/code><\/pre><p>Los índices inválidos lanzan <code>IndexOutOfBoundsException<\/code> con un mensaje como <code>\"índice 7, tamaño 5\"<\/code>.<\/p><p>Escribe al menos 10 checks: añadir más de 4 elementos (fuerza el crecimiento), insertar en medio, eliminar el primero y el último, <code>indexOf<\/code> de algo que no está…<\/p>","hecho":["Pasan 10 checks, incluido uno que verifica que la capacidad pasa de 4 a 8 al añadir el quinto elemento.","<code>remove<\/code> deja a <code>null<\/code> la posición que queda libre al final.","<code>get(tamano)<\/code> lanza excepción aunque el array interno tenga hueco."],"minima":"<p><code>add(T)<\/code>, <code>get<\/code> y <code>size<\/code> con crecimiento ×2, y 4 checks.<\/p>","pista1":"<p>Hay dos números distintos: la <strong>capacidad<\/strong> (<code>datos.length<\/code>, cuánto cabe) y el <strong>tamaño<\/strong> (<code>tamano<\/code>, cuánto has usado). En <code>add<\/code>: si <code>tamano == datos.length<\/code>, crece; después, <code>datos[tamano++] = x;<\/code>.<\/p>","pista2":"<p>Crecer: <code>datos = Arrays.copyOf(datos, datos.length * 2); copias += tamano;<\/code>. Eliminar en <code>i<\/code>: <code>System.arraycopy(datos, i + 1, datos, i, tamano - i - 1); datos[--tamano] = null;<\/code>. Ese <code>null<\/code> evita una fuga de memoria: si no, el array seguiría apuntando al objeto y el recolector de basura no podría liberarlo.<\/p>","pista3":"<p><code>get<\/code> necesita un cast, porque el array es de <code>Object<\/code>:<\/p><pre><code class=\"lang-java\">@SuppressWarnings(\"unchecked\")\npublic T get(int i) {\n    comprobarIndice(i);\n    return (T) datos[i];\n}<\/code><\/pre><p>El cast es seguro porque solo tú metes elementos y siempre son T. No puedes hacer <code>new T[4]<\/code> por el borrado de tipos (tu explicación de la semana 3).<\/p>"},"medir":{"titulo":"Amortización con números reales","objetivo":"Demostrar con tus contadores por qué crecer ×2 es mucho mejor que crecer de 100 en 100, y comparar tu lista con ArrayList.","reto":"<p><strong>Experimento 1: estrategias de crecimiento.<\/strong> Añade a <code>MiLista<\/code> un constructor que permita elegir la estrategia: <code>×2<\/code> o <code>+100<\/code>. Para n = 100 000, 200 000 y 400 000 elementos, apunta <code>copias()<\/code> y el tiempo con cada estrategia. Haz una tabla:<\/p><pre><code>n        copias ×2    copias +100    tiempo ×2    tiempo +100\n100000   ...<\/code><\/pre><p><strong>Experimento 2: tu lista frente a <code>ArrayList<\/code><\/strong> (con <code>Bench<\/code>, n = 1 000 000):<\/p><ul><li><code>add<\/code> al final de n elementos<\/li><li>n llamadas a <code>get<\/code> en posiciones aleatorias (usa <code>new Random(42)<\/code> para que sea repetible)<\/li><li>10 000 <code>remove(0)<\/code> frente a 10 000 <code>remove(último)<\/code><\/li><\/ul>","hecho":["La tabla del experimento 1 está completa en la libreta.","Sabes qué pasa con las copias de cada estrategia cuando n se duplica.","Sabes por qué <code>remove(0)<\/code> es tan caro y <code>remove(último)<\/code> no."],"minima":"<p>Solo el experimento 1, sin tiempos: apunta las copias.<\/p>","pista1":"<p>Con ×2, las copias son 4 + 8 + 16 + … hasta n: esa suma siempre es menor que 2n. Con +100 son 100 + 200 + 300 + … + n, que es aproximadamente n²/200. Compruébalo con tus números.<\/p>","pista2":"<p>Patrón esperado: con ×2, si n se duplica, las copias se duplican (lineal). Con +100, si n se duplica, las copias se multiplican por 4 (cuadrático). Por eso añadir es \"O(1) amortizado\": el coste total repartido entre n operaciones es constante por operación.<\/p>","pista3":"<p>Dato de datamining: <code>ArrayList<\/code> crece ×1,5 (<code>oldCapacity + (oldCapacity &gt;&gt; 1)<\/code>), no ×2. Es un compromiso: ×2 hace menos copias, pero puede desperdiciar hasta la mitad de la memoria. Si tienes tiempo, prueba ×1,5 en tu lista y compara.<\/p>"},"aplicar":{"titulo":"Media móvil de sueño","objetivo":"Usar tu <code>MiLista<\/code> en el problema donde un array dinámico es la mejor opción: acceso por índice a una serie temporal.","reto":"<ol><li>Genera 90 noches de horas de sueño en una <code>MiLista&lt;Double&gt;<\/code> con <code>new Random(42)<\/code> (valores entre 5.0 y 9.0).<\/li><li>Calcula la <strong>media móvil de 7 días<\/strong> (para cada día desde el séptimo, la media de ese día y los 6 anteriores) de dos formas:<ul><li><strong>Ingenua:<\/strong> para cada día, suma los 7 valores.<\/li><li><strong>Ventana deslizante:<\/strong> mantén una suma; en cada paso suma el valor que entra y resta el que sale.<\/li><\/ul><\/li><li>Comprueba con <code>Check<\/code> que las dos dan lo mismo, con margen: <code>Math.abs(a - b) &lt; 1e-9<\/code>.<\/li><li>Pinta un gráfico ASCII de la media móvil: una barra de <code>█<\/code> por día, escalada.<\/li><\/ol><p>¿Por qué aquí gana el array? Porque necesitas <code>get(i - 7)<\/code> al instante: acceso por índice en O(1).<\/p>","hecho":["Las dos versiones coinciden en los 84 días.","El gráfico ASCII se ve por consola.","Sabes cuántas sumas hace cada versión para 90 días y para 100 000 días."],"minima":"<p>Solo la versión ingenua, comprobada con 3 días calculados a mano.<\/p>","pista1":"<p>La primera ventana (días 0 a 6) la sumas entera. A partir de ahí, para el día i: <code>suma += datos.get(i) - datos.get(i - 7);<\/code>. La media es <code>suma / 7<\/code>.<\/p>","pista2":"<p>Para el gráfico: <code>int barras = (int) Math.round((media - 5.0) * 10);<\/code> y <code>\"█\".repeat(barras)<\/code>. Pon el número de día delante con <code>printf(\"%3d %s%n\", dia, \"█\".repeat(barras))<\/code>.<\/p>","pista3":"<p>Coste: la ingenua hace 7 sumas por día (con ventana k, <code>n·k<\/code> en total); la deslizante hace 2 por día (<code>2n<\/code>), sea cual sea la ventana. Con una ventana de 30 días, la diferencia es ×15. El margen de <code>1e-9<\/code> existe porque sumar y restar doubles acumula pequeños errores de redondeo.<\/p>"},"explica":{"reto":"<p>¿Por qué añadir al final de una lista dinámica es \"O(1) amortizado\" si a veces tiene que copiar el array entero? Explícalo con tus números de copias.<\/p>","guia":["Capacidad frente a tamaño.","Qué pasa exactamente cuando el array se llena.","Por qué con ×2 la suma de todas las copias nunca llega a 2n.","Por qué con +100 todo se rompe (tus números)."]}},"bloque":2,"titulo":"Array frente a lista dinámica","resumen":"Construyes tu propio ArrayList desde cero. Es la estructura que más vas a usar en tu vida, y después de esta semana sabrás exactamente qué hace cada vez que llamas a add.","sabes":["Arrays, bucles e índices.","Usar <code>ArrayList<\/code>.","Escribir clases genéricas (semana 3)."],"nuevo":["Capacidad frente a tamaño.","Hacer crecer el array interno con <code>Arrays.copyOf<\/code> y <code>System.arraycopy<\/code>.","Coste amortizado: por qué <code>add<\/code> es \"casi siempre\" barato.","El truco de <code>(T) datos[i]<\/code> sobre un <code>Object[]<\/code>."],"objetivos":["Tener un <code>MiLista&lt;T&gt;<\/code> que pase 10 checks.","Contar cuántas copias de elementos hace tu lista al crecer, con dos estrategias distintas.","Calcular una media móvil de sueño en O(n)."],"tracker":"<code>MiLista&lt;T&gt;<\/code> y <code>Estadisticas.mediaMovil<\/code> para las horas de sueño."},{"n":5,"sesiones":{"construir":{"titulo":"El Complejómetro","objetivo":"Construir una herramienta que estime el exponente de complejidad de cualquier operación duplicando n y midiendo.","reto":"<p>Si un código tarda t(n) y es O(n^k), al duplicar n el tiempo se multiplica por 2^k. Así que <strong>k = log₂(t(2n) / t(n))<\/strong>. Vas a construir una herramienta que lo calcule sola.<\/p><pre><code class=\"lang-java\">public interface Experimento&lt;D&gt; {\n    D preparar(int n);        // crea los datos (NO se mide)\n    void ejecutar(D datos);   // la operación (SÍ se mide)\n}\n\npublic static &lt;D&gt; void analizar(String nombre, Experimento&lt;D&gt; e, int nInicial, int pasos)<\/code><\/pre><p>Para n = nInicial, 2·nInicial, 4·nInicial… (<code>pasos<\/code> veces): prepara, mide <code>ejecutar<\/code> con calentamiento y mediana (reutiliza la lógica de <code>Bench<\/code>) e imprime:<\/p><pre><code>n        tiempo (ms)   ratio   k\n10000    1.204         -       -\n20000    2.391         1.99    0.99\n40000    4.870         2.04    1.03\n≈ O(n^1.0)<\/code><\/pre>","hecho":["Con un bucle que suma n números sale k ≈ 1.","Con dos bucles anidados de n sale k ≈ 2.","La estimación final usa la media de las k de los últimos pasos."],"minima":"<p>Sin la interfaz genérica: un <code>for<\/code> que duplica n, mide con <code>nanoTime<\/code> un bucle anidado e imprime el ratio.<\/p>","pista1":"<p><code>k = Math.log(ratio) / Math.log(2)<\/code>. Si el ratio es ≈ 1 → O(1); ≈ 2 → O(n); ≈ 2,2 → O(n log n); ≈ 4 → O(n²); ≈ 8 → O(n³).<\/p>","pista2":"<p>Los tiempos por debajo de ~1 ms son casi puro ruido. Si te salen muy pequeños, sube <code>nInicial<\/code> o haz que <code>ejecutar<\/code> repita la operación m veces. Descarta el primer paso al calcular la estimación: casi siempre incluye calentamiento del JIT.<\/p>","pista3":"<pre><code class=\"lang-java\">for (int p = 0, n = nInicial; p &lt; pasos; p++, n *= 2) {\n    D datos = e.preparar(n);\n    for (int i = 0; i &lt; 3; i++) e.ejecutar(datos); // calentamiento\n    long[] t = new long[5];\n    for (int i = 0; i &lt; 5; i++) {\n        D copia = e.preparar(n); // por si ejecutar modifica los datos\n        long t0 = System.nanoTime();\n        e.ejecutar(copia);\n        t[i] = System.nanoTime() - t0;\n    }\n    Arrays.sort(t);\n    double ms = t[2] / 1e6;\n    // ratio con el paso anterior, k, imprimir...\n}<\/code><\/pre>"},"medir":{"titulo":"Predice, mide, compara","objetivo":"Escribir tu predicción de complejidad para 5 operaciones y verificarla con el Complejómetro.","reto":"<p>Para cada operación, <strong>escribe primero tu predicción<\/strong> en la libreta y después mide:<\/p><ol><li>n llamadas a <code>MiLista.get(i)<\/code> con i aleatorio<\/li><li>añadir n elementos al final de <code>MiLista<\/code><\/li><li>añadir n elementos con <code>add(0, x)<\/code> (al principio)<\/li><li><code>indexOf<\/code> de un elemento que no está, en una lista de n<\/li><li>¿Hay duplicados en una lista de n enteros?<ul><li>(a) dos bucles anidados comparando todos con todos<\/li><li>(b) ordenar una copia con <code>Arrays.sort<\/code> y comparar vecinos<\/li><\/ul><\/li><\/ol><p>Si una medición no coincide con tu predicción, no la descartes: investiga por qué (ruido, calentamiento, caché de la CPU…).<\/p>","hecho":["6 predicciones y 6 mediciones en la libreta.","Al menos una sorpresa investigada y explicada.","Sabes por qué (b) gana a (a) para n grande y puede perder para n = 10."],"minima":"<p>Solo las operaciones 2 y 3.<\/p>","pista1":"<p>Esperado: 1 → k≈1 (n operaciones O(1)); 2 → k≈1; 3 → k≈2 (cada inserción desplaza todo); 4 → k≈1; 5a → k≈2; 5b → k≈1,1 (n log n).<\/p>","pista2":"<p>Si al crecer n el tiempo da un salto brusco que la complejidad no explica, probablemente los datos han dejado de caber en la caché de la CPU (L2/L3, unos pocos MB). A partir de ahí cada acceso va a la RAM, que es mucho más lenta. Big O no ve esto; tus mediciones sí.<\/p>","pista3":"<p>Para n pequeño mandan las constantes: ordenar tiene un coste fijo (crear la copia, preparar el algoritmo) que dos bucles sobre 10 elementos no tienen. Big O describe cómo crece el coste, no cuánto cuesta para un n concreto.<\/p>"},"aplicar":{"titulo":"Optimiza el informe lento","objetivo":"Reescribir una función del tracker de O(n²) a O(n) y demostrarlo con el Complejómetro.","reto":"<p>Esta función cuenta los \"días perfectos\" (todos los hábitos cumplidos) en un rango de fechas:<\/p><pre><code class=\"lang-java\">public static int diasPerfectos(List&lt;Registro&gt; registros, List&lt;Habito&gt; habitos,\n                                LocalDate desde, LocalDate hasta) {\n    int perfectos = 0;\n    for (LocalDate dia = desde; !dia.isAfter(hasta); dia = dia.plusDays(1)) {\n        boolean todos = true;\n        for (Habito h : habitos) {\n            boolean hecho = false;\n            for (Registro r : registros) // recorre TODOS los registros\n                if (r.habitoId().equals(h.id()) &amp;&amp; r.fecha().equals(dia) &amp;&amp; r.valor() &gt; 0)\n                    hecho = true;\n            if (!hecho) todos = false;\n        }\n        if (todos) perfectos++;\n    }\n    return perfectos;\n}<\/code><\/pre><ol><li>Calcula su complejidad en función de d (días), h (hábitos) y r (registros).<\/li><li>Reescríbela para recorrer los registros <strong>una sola vez<\/strong>, guardándolos en un array indexado por el número de días desde <code>desde<\/code>.<\/li><li>Comprueba con <code>Check<\/code> que las dos versiones dan el mismo resultado con datos aleatorios (semilla 42).<\/li><li>Demuéstralo con el Complejómetro, haciendo crecer el número de días del rango (y los registros con él).<\/li><\/ol>","hecho":["Las dos versiones devuelven lo mismo con 3 conjuntos de datos distintos.","El Complejómetro da k≈2 para la vieja y k≈1 para la nueva.","Sabes explicar el truco: has cambiado tiempo por memoria."],"minima":"<p>Los pasos 1 y 2, comprobando con un solo conjunto de datos.<\/p>","pista1":"<p>La original es O(d · h · r). Como r crece con d (más días, más registros), en la práctica es cuadrática en el número de días.<\/p>","pista2":"<p>El índice de un registro: <code>int i = (int) ChronoUnit.DAYS.between(desde, r.fecha());<\/code>. Crea <code>boolean[][] hecho = new boolean[dias][habitos.size()]<\/code> y un mapa del id del hábito a su posición (un bucle de búsqueda vale: hay pocos hábitos). Recorre los registros una vez marcando <code>hecho[i][posHabito] = true<\/code>, y después cuenta las filas con todo a true.<\/p>","pista3":"<p>Acabas de inventar una tabla hash muy simple: una función (días desde el inicio) que convierte la clave (la fecha) en una posición de un array, para encontrarla en O(1) sin buscar. En la semana 8 la generalizas a cualquier clave.<\/p>"},"explica":{"reto":"<p>¿Qué significa realmente que algo sea O(n)? Explica por qué un algoritmo O(n) puede ser más lento que uno O(n²) para n pequeño, y cómo tu Complejómetro detecta la complejidad sin mirar el código.<\/p>","guia":["Big O habla de cómo crece el coste, no de cuánto cuesta.","El experimento de duplicación y la fórmula del exponente.","Constantes, caché y calentamiento: lo que Big O ignora.","Tu ejemplo de días perfectos: antes y después."]}},"bloque":2,"titulo":"Complejidad: demuéstralo, no lo adivines","resumen":"Big O deja de ser teoría de examen. Construyes una herramienta que mide la complejidad de cualquier código de forma experimental, y la usas para optimizar una función lenta del tracker.","sabes":["Medir con tu <code>Bench<\/code>.","Tus números de la semana 4: con ×2 las copias se duplican; con +100 se multiplican por 4."],"nuevo":["Notación Big O: O(1), O(log n), O(n), O(n log n), O(n²).","El experimento de duplicación: estimar la complejidad midiendo.","Por qué los microbenchmarks mienten, y cómo detectarlo."],"objetivos":["Tener un <code>Complejometro<\/code> que imprime \"≈ O(n^1.0)\" midiendo una función.","Predecir y después medir la complejidad de 5 operaciones.","Bajar una función del tracker de O(n²) a O(n), con la prueba."],"tracker":"<code>diasPerfectos<\/code> optimizado con un índice por día."},{"n":6,"sesiones":{"construir":{"titulo":"MiListaEnlazada&lt;T&gt;","objetivo":"Implementar una lista doblemente enlazada genérica que se pueda recorrer con for-each.","reto":"<p>Crea <code>estructuras.MiListaEnlazada&lt;T&gt; implements Iterable&lt;T&gt;<\/code>:<\/p><pre><code class=\"lang-java\">private static final class Nodo&lt;T&gt; {\n    T valor; Nodo&lt;T&gt; ant, sig;\n}\nprivate Nodo&lt;T&gt; cabeza, cola;\nprivate int tamano;<\/code><\/pre><p>Métodos:<\/p><ul><li><code>addFirst(T)<\/code> y <code>addLast(T)<\/code><\/li><li><code>removeFirst()<\/code> y <code>removeLast()<\/code> (lanzan <code>NoSuchElementException<\/code> si está vacía)<\/li><li><code>get(int i)<\/code>, con una <strong>optimización<\/strong>: si i está en la segunda mitad, recorre desde la cola hacia atrás<\/li><li><code>size()<\/code> e <code>iterator()<\/code><\/li><\/ul><p>Checks: lista vacía, un solo elemento (el caso que más bugs da), varios elementos, y un <code>for (T x : lista)<\/code> que recorra en orden.<\/p>","hecho":["Añadir y quitar por los dos extremos funciona, incluido pasar de 1 elemento a 0 y volver a 1.","<code>for (String s : lista)<\/code> recorre en orden.","<code>get<\/code> recorre desde el extremo más cercano (compruébalo contando pasos o con un print temporal)."],"minima":"<p>Lista simple (solo <code>sig<\/code>): <code>addFirst<\/code>, <code>addLast<\/code>, <code>get<\/code> y <code>size<\/code>.<\/p>","pista1":"<p>Dibújalo en papel antes de programar: cajas con flechas. Casi todos los bugs están en dos casos: la lista vacía (cabeza y cola son null) y la lista de un elemento (cabeza y cola son el mismo nodo).<\/p>","pista2":"<pre><code class=\"lang-java\">public T removeLast() {\n    if (cola == null) throw new NoSuchElementException();\n    T v = cola.valor;\n    cola = cola.ant;\n    if (cola == null) cabeza = null;  // se ha quedado vacía\n    else cola.sig = null;\n    tamano--;\n    return v;\n}<\/code><\/pre>","pista3":"<p>El iterador es una clase interna que recuerda por dónde va:<\/p><pre><code class=\"lang-java\">public Iterator&lt;T&gt; iterator() {\n    return new Iterator&lt;&gt;() {\n        Nodo&lt;T&gt; actual = cabeza;\n        public boolean hasNext() { return actual != null; }\n        public T next() {\n            if (actual == null) throw new NoSuchElementException();\n            T v = actual.valor;\n            actual = actual.sig;\n            return v;\n        }\n    };\n}<\/code><\/pre>"},"medir":{"titulo":"LinkedList está sobrevalorada","objetivo":"Medir cuándo gana de verdad una lista enlazada y descubrir el efecto de la caché de la CPU.","reto":"<p>Con <code>Bench<\/code> o el Complejómetro, compara <code>MiListaEnlazada<\/code> con <code>MiLista<\/code> (y, si quieres, <code>LinkedList<\/code> con <code>ArrayList<\/code>):<\/p><ol><li><strong>Insertar al principio<\/strong> 100 000 elementos (<code>addFirst<\/code> frente a <code>add(0, x)<\/code>).<\/li><li><strong>Recorrer y sumar<\/strong> 1 000 000 de enteros (for-each en las dos).<\/li><li><strong>Acceso en medio<\/strong>: 1 000 llamadas a <code>get(n / 2)<\/code> con n = 100 000.<\/li><li><strong>Memoria por elemento<\/strong>: mídela con <code>Runtime<\/code>, como en la semana 1.<\/li><\/ol><p>Antes de medir, apunta tu predicción para cada una. El punto 2 es el importante: las dos son O(n). ¿Tardan lo mismo?<\/p>","hecho":["4 resultados con su predicción en la libreta.","Sabes cuántas veces más lento es recorrer la enlazada, aunque las dos sean O(n).","Tienes los bytes por elemento de las dos."],"minima":"<p>Solo los puntos 1 y 2.<\/p>","pista1":"<p>Esperado: en el 1 gana con mucho la enlazada (O(1) frente a O(n) por inserción). En el 3 gana con mucho <code>MiLista<\/code> (O(1) frente a O(n)).<\/p>","pista2":"<p>En el 2 las dos son O(n), pero el array suele ir varias veces más rápido. Los elementos de un array están contiguos en memoria: la CPU carga bloques de 64 bytes (líneas de caché) y adivina lo siguiente que vas a leer. Los nodos están desperdigados por el heap y cada salto puede ser un fallo de caché.<\/p>","pista3":"<p>Memoria: cada nodo es un objeto con cabecera (12 bytes) + 3 referencias (valor, ant, sig: 12 bytes) = 24 bytes, más el <code>Integer<\/code> (16). Unos 40 bytes por elemento frente a los ~20 de <code
