>MiLista&lt;Integer&gt;<\/code> (4 de la referencia + 16 del <code>Integer<\/code>). Conclusión típica: la enlazada solo gana si insertas o borras en los extremos, o si <strong>ya tienes el nodo<\/strong>.<\/p>"},"aplicar":{"titulo":"Feed de actividad con deshacer selectivo","objetivo":"Usar la única ventaja real de la lista enlazada (borrar en O(1) teniendo el nodo) en una funcionalidad del tracker.","reto":"<p>El tracker guarda un feed de acciones (\"marcado gym 07/12\", \"desmarcado dientes 08/12\"…). Las más recientes van delante, y puedes <strong>deshacer cualquier acción concreta<\/strong>, no solo la última.<\/p><ol><li>Añade a <code>MiListaEnlazada<\/code> dos métodos que expongan el nodo como \"resguardo\":<\/li><\/ol><pre><code class=\"lang-java\">public Object addFirstConResguardo(T valor) // devuelve el nodo, como Object opaco\npublic T eliminar(Object resguardo)         // lo quita en O(1)<\/code><\/pre><ol start=\"2\"><li>Crea <code>tracker.FeedActividad<\/code> con:<ul><li><code>registrar(String accion)<\/code>, que devuelve un id numérico (0, 1, 2…)<\/li><li><code>deshacer(int id)<\/code>, que quita esa acción del feed en O(1)<\/li><li><code>ultimas(int k)<\/code>, que devuelve las k más recientes<\/li><\/ul><\/li><\/ol><p>Guarda los resguardos en una <code>MiLista&lt;Object&gt;<\/code> donde la posición es el id (combinas las semanas 4 y 6).<\/p>","hecho":["Registras 5 acciones, deshaces la 2 y ves las 4 restantes en orden (con checks).","<code>deshacer<\/code> no recorre la lista (no hay bucles dentro).","Deshacer dos veces el mismo id no rompe nada."],"minima":"<p>Solo <code>registrar<\/code> y <code>ultimas<\/code> (sin deshacer).<\/p>","pista1":"<p>Devuelves el <code>Nodo<\/code> como <code>Object<\/code> para no exponer tu clase interna: quien lo recibe solo puede devolvértelo. Dentro de <code>eliminar<\/code> haces el cast a <code>Nodo&lt;T&gt;<\/code>.<\/p>","pista2":"<p>Eliminar un nodo de una lista doble tiene 4 casos: tiene anterior o no (si no, es la cabeza), y tiene siguiente o no (si no, es la cola). <code>if (n.ant != null) n.ant.sig = n.sig; else cabeza = n.sig;<\/code> y lo mismo al revés.<\/p>","pista3":"<p>Para que deshacer dos veces no rompa nada: tras eliminar, haz <code>resguardos.set(id, null)<\/code> y, en <code>deshacer<\/code>, si el resguardo es null, no hagas nada. Esta combinación (de id a nodo + lista enlazada) es exactamente la base de una caché LRU, que montarás en la semana 8.<\/p>"},"explica":{"reto":"<p>Si insertar en una lista enlazada es O(1), ¿por qué <code>ArrayList<\/code> gana casi siempre en la práctica? Explícalo con tus números.<\/p>","guia":["O(1) para insertar, pero ¿cuánto cuesta llegar a la posición?","La memoria por elemento (tus bytes).","La caché de la CPU y la memoria contigua.","El único caso en que la enlazada gana claramente (tu feed de actividad)."]}},"bloque":2,"titulo":"Listas enlazadas y nodos","resumen":"Construyes una estructura hecha de objetos que se apuntan unos a otros. Y descubres con tus números por qué, en la práctica, casi nunca gana a tu MiLista.","sabes":["Qué es una referencia (semana 1).","Tu <code>MiLista<\/code> y los genéricos."],"nuevo":["Nodos enlazados: listas simples y dobles.","<code>Iterator<\/code> e <code>Iterable<\/code>: que tu estructura funcione con for-each.","Localidad de caché: por qué la memoria contigua es tan rápida.","Referencias a nodos (\"resguardos\") para borrar en O(1)."],"objetivos":["Tener una <code>MiListaEnlazada&lt;T&gt;<\/code> doble que funcione en un for-each.","Medir cuándo gana y cuándo pierde frente a <code>MiLista<\/code>.","Borrar un elemento cualquiera en O(1) teniendo su nodo."],"tracker":"<code>FeedActividad<\/code>: historial de acciones con deshacer selectivo."},{"n":7,"sesiones":{"construir":{"titulo":"Pila y cola circular","objetivo":"Implementar una pila sobre array y una cola circular que crece sin perder el orden.","reto":"<p>Define los contratos:<\/p><pre><code class=\"lang-java\">public interface Pila&lt;T&gt; { void push(T x); T pop(); T peek(); boolean isEmpty(); int size(); }\npublic interface Cola&lt;T&gt; { void offer(T x); T poll(); T peek(); boolean isEmpty(); int size(); }<\/code><\/pre><ul><li><code>PilaArray&lt;T&gt;<\/code>: sobre un array que crece ×2. <code>pop<\/code> con la pila vacía lanza <code>NoSuchElementException<\/code>.<\/li><li><code>ColaCircular&lt;T&gt;<\/code>: array con <code>cabeza<\/code> (índice del primero) y <code>tamano<\/code>. Las posiciones dan la vuelta con <code>%<\/code>. <code>poll<\/code> con la cola vacía devuelve <code>null<\/code> (como <code>java.util.Queue<\/code>). Cuando se llena, crece ×2 <strong>manteniendo el orden<\/strong>.<\/li><\/ul><p>Checks clave para la cola: llénala, saca 3, mete 3 más (el final da la vuelta al principio del array) y fuerza el crecimiento en ese estado.<\/p>","hecho":["<code>PilaArray<\/code> devuelve los elementos en orden inverso al de entrada.","<code>ColaCircular<\/code> mantiene el orden FIFO después de dar la vuelta y de crecer.","<code>poll<\/code> no mueve ningún elemento (no hay <code>arraycopy<\/code> en <code>poll<\/code>)."],"minima":"<p>Solo <code>PilaArray<\/code> (es tu <code>MiLista<\/code> con restricciones: unos 10 minutos).<\/p>","pista1":"<p>Imagina el array como la esfera de un reloj: después de la última posición viene la 0. <code>poll<\/code> no desplaza nada: solo avanza <code>cabeza<\/code>. La posición donde entra el siguiente es <code>(cabeza + tamano) % capacidad<\/code>.<\/p>","pista2":"<pre><code class=\"lang-java\">public void offer(T x) {\n    if (tamano == datos.length) crecer();\n    datos[(cabeza + tamano) % datos.length] = x;\n    tamano++;\n}\npublic T poll() {\n    if (tamano == 0) return null;\n    T x = (T) datos[cabeza];\n    datos[cabeza] = null;\n    cabeza = (cabeza + 1) % datos.length;\n    tamano--;\n    return x;\n}<\/code><\/pre>","pista3":"<p>Al crecer no basta con <code>Arrays.copyOf<\/code>: si la cola ha dado la vuelta, el orden en el array no es el orden de la cola. Copia elemento a elemento, <code>nuevo[i] = datos[(cabeza + i) % datos.length]<\/code> para i de 0 a tamano - 1, y después <code>cabeza = 0<\/code>.<\/p>"},"medir":{"titulo":"La cola ingenua frente a la circular","objetivo":"Medir el coste de una cola que desplaza elementos frente a una circular, y comprobar por qué <code>Stack<\/code> es la opción equivocada.","reto":"<ol><li><strong>Cola ingenua:<\/strong> una cola sobre <code>MiLista<\/code> donde <code>poll()<\/code> hace <code>remove(0)<\/code>. Con el Complejómetro: n <code>offer<\/code> seguidos de n <code>poll<\/code>, comparando la ingenua, <code>ColaCircular<\/code> y <code>ArrayDeque<\/code>.<\/li><li><strong>Pila:<\/strong> 10 millones de <code>push<\/code> y <code>pop<\/code> alternos con <code>java.util.Stack<\/code>, <code>ArrayDeque<\/code> y tu <code>PilaArray<\/code>.<\/li><li><strong>Datamining:<\/strong> abre el código fuente de <code>Stack<\/code> (Ctrl+clic en IntelliJ). ¿De qué clase hereda? ¿Qué palabra clave aparece en sus métodos?<\/li><\/ol>","hecho":["La k de cada cola apuntada (deberías ver ≈2 frente a ≈1).","Los tiempos de las 3 pilas.","Sabes por qué la documentación de Java recomienda <code>ArrayDeque<\/code> en lugar de <code>Stack<\/code>."],"minima":"<p>Solo el punto 1, comparando ingenua y circular con n = 50 000.<\/p>","pista1":"<p>La ingenua es O(n) por cada <code>poll<\/code> (desplaza todo el array), así que n <code>poll<\/code> son O(n²). La circular es O(1) por operación.<\/p>","pista2":"<p><code>Stack<\/code> hereda de <code>Vector<\/code>, una clase de Java 1.0 con todos los métodos <code>synchronized<\/code> (pensados para varios hilos). Aunque uses un solo hilo, pagas ese mecanismo en cada operación. Además, al heredar de <code>Vector<\/code> permite cosas que una pila no debería permitir, como <code>get(3)<\/code> o <code>add(0, x)<\/code>: un ejemplo clásico de herencia mal usada (semana 2).<\/p>","pista3":"<p><code>ArrayDeque<\/code> es exactamente tu <code>ColaCircular<\/code> (un array circular), pero sirve como pila y como cola por los dos extremos. Si tus tiempos se parecen a los suyos, has construido lo mismo que la JDK.<\/p>"},"aplicar":{"titulo":"Deshacer y rehacer en el tracker","objetivo":"Implementar deshacer y rehacer con dos pilas usando objetos \"comando\".","reto":"<ol><li>Define la interfaz:<\/li><\/ol><pre><code class=\"lang-java\">public interface Comando {\n    void ejecutar();\n    void deshacer();\n    String descripcion();\n}<\/code><\/pre><ol start=\"2\"><li>Implementa <code>MarcarHabito<\/code> y <code>DesmarcarHabito<\/code>, que actúan sobre una lista de registros del tracker.<\/li><li>Crea <code>Historial<\/code> con dos <code>PilaArray&lt;Comando&gt;<\/code>:<ul><li><code>hacer(Comando c)<\/code>: ejecuta, mete en la pila de deshacer y <strong>vacía<\/strong> la de rehacer.<\/li><li><code>deshacer()<\/code>: saca de deshacer, llama a <code>c.deshacer()<\/code> y mete en rehacer.<\/li><li><code>rehacer()<\/code>: lo contrario.<\/li><\/ul><\/li><li>Prueba esta secuencia con checks: marcar gym, marcar dientes, deshacer, deshacer, rehacer, marcar dormir, rehacer (este último no debe hacer nada).<\/li><\/ol><p><strong>Misión secundaria (opcional):<\/strong> <code>validarParentesis(String s)<\/code> con una pila: <code>\"{[()]}\"<\/code> es válido y <code>\"{[(])}\"<\/code> no. Te servirá en la semana 15.<\/p>","hecho":["La secuencia del paso 4 deja exactamente los registros esperados.","Después de una acción nueva, rehacer no hace nada.","Deshacer con el historial vacío no lanza excepción (devuelve false o no hace nada)."],"minima":"<p>Solo deshacer (una pila) con <code>MarcarHabito<\/code>.<\/p>","pista1":"<p>Cada comando guarda todo lo que necesita para deshacerse: <code>MarcarHabito<\/code> guarda el registro que añadió, y así su <code>deshacer()<\/code> sabe exactamente qué quitar.<\/p>","pista2":"<p>¿Por qué hay que vaciar rehacer al hacer algo nuevo? Porque la \"línea temporal\" ha cambiado: lo que habías deshecho ya no encaja después de la acción nueva. Es lo mismo que pasa en cualquier editor de texto.<\/p>","pista3":"<p>Para los paréntesis: recorre el texto; si el carácter es de apertura, <code>push<\/code>; si es de cierre, la pila no puede estar vacía y <code>pop()<\/code> debe ser su pareja. Al final, la pila tiene que quedar vacía.<\/p>"},"explica":{"reto":"<p>¿Por qué el botón de deshacer usa una pila y una cola de impresión usa una cola? Explica también por qué un buffer circular nunca necesita mover elementos.<\/p>","guia":["LIFO frente a FIFO, con ejemplos de la vida real y de tu tracker.","Tu cola ingenua frente a la circular (tus números).","El \"reloj\" del buffer circular y el <code>%<\/code>.","Por qué <code>Stack<\/code> es un ejemplo de herencia mal usada."]}},"bloque":2,"titulo":"Pilas y colas","resumen":"Dos contratos sencillos (el último que entra sale primero; el primero que entra sale primero) que aparecen en todas partes: deshacer, la pila de llamadas, las colas de mensajes. Construyes la cola circular, la pieza que usa ArrayDeque por dentro.","sabes":["<code>MiLista<\/code> y <code>MiListaEnlazada<\/code>.","El operador módulo <code>%<\/code>.","Interfaces (semana 2)."],"nuevo":["LIFO y FIFO como contratos (interfaces).","Buffer circular: una cola sobre un array que nunca mueve elementos.","Por qué la documentación de Java dice que no uses <code>Stack<\/code>."],"objetivos":["Tener <code>PilaArray&lt;T&gt;<\/code> y <code>ColaCircular&lt;T&gt;<\/code> funcionando con sus checks.","Medir una cola circular frente a una cola ingenua que desplaza elementos.","Añadir deshacer y rehacer al tracker con dos pilas."],"tracker":"<code>Historial<\/code> con deshacer y rehacer de acciones."},{"n":8,"sesiones":{"construir":{"titulo":"MiHashMap&lt;K, V&gt;","objetivo":"Implementar un mapa hash genérico con encadenamiento y rehash automático.","reto":"<p>Crea <code>estructuras.MiHashMap&lt;K, V&gt;<\/code>:<\/p><pre><code class=\"lang-java\">private static final class Entrada&lt;K, V&gt; {\n    final K clave; final int hash; V valor; Entrada&lt;K, V&gt; sig;\n}\nprivate Entrada&lt;K, V&gt;[] cubetas; // capacidad inicial 16 (potencia de 2)\nprivate int tamano;<\/code><\/pre><p>Métodos:<\/p><ul><li><code>V put(K clave, V valor)<\/code>: si la clave existe, reemplaza el valor y devuelve el anterior; si no, añade y devuelve null.<\/li><li><code>V get(K clave)<\/code>, <code>boolean containsKey(K clave)<\/code>, <code>V remove(K clave)<\/code> e <code>int size()<\/code>.<\/li><li><strong>Rehash:<\/strong> cuando <code>tamano &gt; capacidad * 0.75<\/code>, duplica las cubetas y recoloca todas las entradas.<\/li><li>Clave null → <code>IllegalArgumentException<\/code> (simplifica las cosas).<\/li><\/ul><p>Checks: 1 000 claves (fuerza varios rehash), reemplazar un valor, y borrar del principio, del medio y del final de una cadena.<\/p>","hecho":["Las 1 000 claves se recuperan con su valor después de varios rehash.","Un <code>put<\/code> sobre una clave existente no aumenta <code>size()<\/code>.","<code>remove<\/code> funciona aunque la entrada esté en mitad de una cadena."],"minima":"<p><code>put<\/code> y <code>get<\/code> con 16 cubetas fijas (sin rehash ni remove).<\/p>","pista1":"<p>Es un array de mini listas enlazadas (semana 6). <code>get<\/code>: calcula el índice de la cubeta y recorre su cadena comparando con <code>equals<\/code>. Para ir más rápido, compara primero el <code>hash<\/code> guardado (un int) y solo si coincide llama a <code>equals<\/code>.<\/p>","pista2":"<pre><code class=\"lang-java\">private int indice(Object clave, int capacidad) {\n    int h = clave.hashCode();\n    h ^= (h &gt;&gt;&gt; 16);              // mezcla los bits altos con los bajos\n    return h &amp; (capacidad - 1);   // como % capacidad, pero nunca negativo\n}<\/code><\/pre><p><code>hashCode<\/code> puede ser negativo, y <code>%<\/code> con negativos da un resultado negativo (índice inválido). Con capacidad potencia de 2, <code>&amp; (capacidad - 1)<\/code> se queda con los bits bajos; por eso antes se mezclan con los altos.<\/p>","pista3":"<p>Crear un array genérico: <code>cubetas = (Entrada&lt;K, V&gt;[]) new Entrada[16];<\/code> (con <code>@SuppressWarnings(\"unchecked\")<\/code>). Rehash: crea el array nuevo del doble de tamaño; recorre cada cubeta vieja y cada entrada de su cadena, calcula su índice nuevo y métela al principio de la cubeta nueva. Puedes reutilizar el <code>hash<\/code> guardado.<\/p>"},"medir":{"titulo":"Rompe el hash a propósito","objetivo":"Medir tu mapa frente a HashMap y ver cómo se degrada con colisiones masivas y con distintos factores de carga.","reto":"<ol><li><strong>Frente a <code>HashMap<\/code>:<\/strong> <code>put<\/code> y <code>get<\/code> de 1 000 000 de claves <code>Integer<\/code>. ¿Cuántas veces más lento es el tuyo?<\/li><li><strong>Hash malo:<\/strong> crea <code>ClaveMala<\/code> con un campo int, un <code>equals<\/code> correcto y <code>hashCode() { return 42; }<\/code>. Con el Complejómetro, inserta n claves (n = 2 000, 4 000 y 8 000) en tu mapa. ¿Qué k sale?<\/li><li><strong>Mecánica oculta de la JDK:<\/strong> repite el punto 2 con <code>HashMap<\/code>, primero con <code>ClaveMala<\/code> tal cual y después haciendo que implemente <code>Comparable&lt;ClaveMala&gt;<\/code>. Compara las k.<\/li><li><strong>Factor de carga:<\/strong> con tu mapa, prueba 0,5, 0,75, 1,0 y 2,0. Apunta el tiempo de <code>get<\/code> y el número de cubetas.<\/li><\/ol>","hecho":["La k del hash malo en tu mapa (≈2) y en <code>HashMap<\/code> con y sin <code>Comparable<\/code>.","La tabla del factor de carga en la libreta.","Sabes qué es \"treeify\" y por qué necesita <code>Comparable<\/code> para funcionar bien."],"minima":"<p>Solo el punto 2 con tu mapa.<\/p>","pista1":"<p>Con un <code>hashCode<\/code> constante, todas las claves caen en la misma cubeta: el mapa se convierte en una lista enlazada. Cada <code>put<\/code> recorre la cadena entera para ver si la clave ya existe: O(n) por operación, O(n²) en total.<\/p>","pista2":"<p>Desde Java 8, <code>HashMap<\/code> convierte una cadena en un árbol (rojo-negro) cuando supera 8 elementos y la tabla tiene al menos 64 cubetas. Para ordenar ese árbol usa <code>compareTo<\/code> si la clase es <code>Comparable<\/code>. Si no lo es, no puede ordenar por la clave y la búsqueda sigue siendo casi lineal.<\/p>","pista3":"<p>Factor de carga: más bajo → más cubetas vacías (más memoria) pero cadenas más cortas (más velocidad). Más alto → menos memoria y cadenas más largas. El 0,75 de Java es un compromiso medido durante años. Tus números te dirán si lo ves igual.<\/p>"},"aplicar":{"titulo":"El índice por fecha y la racha actual","objetivo":"Indexar los registros del tracker por fecha para responder en O(1) y calcular rachas.","reto":"<ol><li>Crea <code>tracker.IndiceRegistros<\/code> con un <code>MiHashMap&lt;LocalDate, MiLista&lt;Registro&gt;&gt;<\/code>:<ul><li><code>agregar(Registro r)<\/code><\/li><li><code>delDia(LocalDate fecha)<\/code>, que devuelve una lista (vacía si no hay nada, nunca null)<\/li><li><code>hecho(String habitoId, LocalDate fecha)<\/code>, que devuelve un boolean<\/li><\/ul><\/li><li>Reescribe <code>diasPerfectos<\/code> de la semana 5 usando el índice.<\/li><li><code>rachaActual(String habitoId, LocalDate hoy)<\/code>: cuántos días seguidos, contando hacia atrás desde hoy, está hecho el hábito. Coste: O(longitud de la racha).<\/li><\/ol><p><strong>Misión secundaria (opcional):<\/strong> una caché LRU de capacidad k con <code>MiHashMap<\/code> y los resguardos de <code>MiListaEnlazada<\/code> (semana 6): <code>get<\/code> mueve el elemento al principio y, si se supera k, se elimina el último. Es el secreto de <code>LinkedHashMap<\/code>.<\/p>","hecho":["<code>hecho(\"gym\", fecha)<\/code> no recorre todos los registros.","<code>diasPerfectos<\/code> con el índice da lo mismo que tus versiones anteriores.","<code>rachaActual<\/code> probado con una racha de 0, de 1 y de 5 días."],"minima":"<p>Solo <code>agregar<\/code> y <code>delDia<\/code>, con checks.<\/p>","pista1":"<p><code>LocalDate<\/code> ya tiene <code>equals<\/code> y <code>hashCode<\/code> bien implementados, y es inmutable. Por eso es una clave perfecta para un mapa.<\/p>","pista2":"<p>En <code>agregar<\/code>: <code>MiLista&lt;Registro&gt; l = mapa.get(fecha); if (l == null) { l = new MiLista&lt;&gt;(); mapa.put(fecha, l); } l.add(r);<\/code><\/p>","pista3":"<pre><code class=\"lang-java\">int racha = 0;\nLocalDate d = hoy;\nwhile (hecho(habitoId, d)) { racha++; d = d.minusDays(1); }\nreturn racha;<\/code><\/pre><p>Cada paso es O(1) gracias al mapa, así que el total es O(racha).<\/p>"},"explica":{"reto":"<p>Explica qué ocurre dentro de un <code>HashMap<\/code> cuando haces <code>put(\"gym\", 4)<\/code>, desde <code>hashCode<\/code> hasta la cubeta. Después explica por qué, si sobrescribes <code>equals<\/code>, tienes que sobrescribir <code>hashCode<\/code>, usando las cubetas en tu explicación.<\/p>","guia":["<code>hashCode<\/code> → mezcla de bits → índice.","Colisiones y cadenas.","Factor de carga y rehash: por qué el mapa crece.","Tu experimento del hash malo, y el bug del <code>HashSet<\/code> de la semana 1 visto ahora desde dentro."]}},"bloque":2,"titulo":"Mapas hash","resumen":"La estructura más importante del backend. Construyes tu propio HashMap con cubetas, colisiones y rehash, lo rompes a propósito con un hashCode malo y lo usas para indexar el tracker por fecha.","sabes":["<code>equals<\/code>, <code>hashCode<\/code> y el bug del <code>HashSet<\/code> (semana 1).","Nodos enlazados (semana 6).","Tu índice por día (semana 5)."],"nuevo":["De <code>hashCode<\/code> a índice: <code>(h ^ (h &gt;&gt;&gt; 16)) &amp; (capacidad - 1)<\/code>.","Colisiones y encadenamiento.","Factor de carga y rehash.","Qué hace <code>HashMap<\/code> cuando las colisiones se disparan (treeify)."],"objetivos":["Tener un <code>MiHashMap&lt;K, V&gt;<\/code> que crece solo.","Ver con números cómo un <code>hashCode<\/code> malo convierte O(1) en O(n).","Saber si un hábito se hizo un día concreto en O(1)."],"tracker":"<code>IndiceRegistros<\/code>: registros por fecha en O(1), y cálculo de la racha actual."},{"n":9,"sesiones":{"construir":{"titulo":"La receta de dos preguntas","objetivo":"Escribir 4 funciones recursivas aplicando siempre el mismo método.","reto":"<p>Antes de cada función, escribe como comentario las respuestas a las dos preguntas:<\/p><ol><li><strong>Caso base:<\/strong> ¿cuál es la versión más pequeña del problema, cuya respuesta sé sin pensar?<\/li><li><strong>Paso:<\/strong> si alguien me resolviera el problema un poco más pequeño, ¿cómo uso su respuesta?<\/li><\/ol><p>Funciones, en orden de dificultad:<\/p><ol><li><code>int sumar(Nodo&lt;Integer&gt; n)<\/code>: suma una lista de nodos de forma recursiva.<\/li><li><code>long potencia(long base, int exp)<\/code>: primero la versión O(n) y después la <strong>rápida<\/strong>, O(log n).<\/li><li><code>int busquedaBinaria(int[] ordenado, int x, int ini, int fin)<\/code>: devuelve la posición o -1.<\/li><li><strong>(Jefe)<\/strong> <code>Nodo&lt;T&gt; invertir(Nodo&lt;T&gt; n)<\/code>: invierte una lista enlazada simple de forma recursiva.<\/li><\/ol>","hecho":["Cada función tiene su comentario de caso base y paso.","<code>potencia(2, 62)<\/code> coincide con <code>1L &lt;&lt; 62<\/code>, y la rápida hace unas 7 llamadas en vez de 62 (cuéntalas).","La búsqueda binaria funciona con el elemento al principio, al final y ausente."],"minima":"<p>Las funciones 1 y 2 (versión O(n)).<\/p>","pista1":"<p><code>sumar<\/code>: caso base, nodo null → 0. Paso: <code>n.valor + sumar(n.sig)<\/code>. La receta siempre tiene esta forma: un if para el caso base y un return que usa la llamada con un problema más pequeño.<\/p>","pista2":"<p>Potencia rápida, con división entera: x^n = (x^(n/2))² si n es par, y x · (x^(n/2))² si es impar. <strong>Guarda la mitad en una variable<\/strong>: <code>long mitad = potencia(base, exp / 2);<\/code> y después <code>return exp % 2 == 0 ? mitad * mitad : base * mitad * mitad;<\/code>. Si escribes <code>potencia(base, exp / 2) * potencia(base, exp / 2)<\/code> haces dos llamadas y vuelves a O(n).<\/p>","pista3":"<p>Búsqueda binaria: <code>int medio = ini + (fin - ini) / 2;<\/code>. ¿Por qué no <code>(ini + fin) / 2<\/code>? Porque con arrays enormes <code>ini + fin<\/code> puede desbordar el int y dar un negativo: fue un bug real de la JDK que pasó años sin detectarse, hasta 2006. Invertir: caso base, null o un solo nodo → devuélvelo. Paso: <code>Nodo&lt;T&gt; nuevaCabeza = invertir(n.sig); n.sig.sig = n; n.sig = null; return nuevaCabeza;<\/code>.<\/p>"},"medir":{"titulo":"Los límites de la pila y el poder de la memoria","objetivo":"Medir cuántas llamadas aguanta tu pila y cuánto trabajo ahorra la memoización.","reto":"<p><strong>Experimento 1: profundidad máxima.<\/strong><\/p><pre><code class=\"lang-java\">static int profundidad = 0;\nstatic void bajar() { profundidad++; bajar(); }<\/code><\/pre><p>Llama a <code>bajar()<\/code> dentro de un <code>try { } catch (StackOverflowError e) { }<\/code> e imprime <code>profundidad<\/code>. Después repite con la opción de la JVM <code>-Xss4m<\/code> (en IntelliJ: <em>Run → Edit Configurations → VM options<\/em>). Prueba también a añadir 5 variables locales <code>long<\/code> a <code>bajar()<\/code>: ¿cambia la profundidad?<\/p><p><strong>Experimento 2: Fibonacci.<\/strong> Tres versiones, contando llamadas y midiendo el tiempo para n = 25, 30, 35 y 40:<\/p><ul><li>Ingenua: <code>fib(n) = fib(n - 1) + fib(n - 2)<\/code><\/li><li>Memoizada: con tu <code>MiHashMap&lt;Integer, Long&gt;<\/code><\/li><li>Iterativa: un bucle con dos variables<\/li><\/ul>","hecho":["La profundidad máxima por defecto y con <code>-Xss4m<\/code>, apuntadas.","La tabla de llamadas y tiempos de las tres versiones de Fibonacci.","Sabes por qué el Complejómetro no daría una k estable con la versión ingenua."],"minima":"<p>Solo Fibonacci ingenuo frente a memoizado con n = 30, contando llamadas.<\/p>","pista1":"<p>Cada llamada ocupa un \"marco\" en la pila del hilo, con sus parámetros y sus variables locales. La pila tiene un tamaño fijo (<code>-Xss<\/code>), así que más variables locales por marco significa menos llamadas posibles.<\/p>","pista2":"<p><code>fib(40)<\/code> ingenuo hace unos 330 millones de llamadas: calcula <code>fib(2)<\/code> decenas de millones de veces. Memoizado hace unas 80. Es la diferencia entre un crecimiento exponencial y uno lineal.<\/p>","pista3":"<p>El Complejómetro supone O(n^k) con una k fija. En un crecimiento exponencial, la k que mide no deja de aumentar cuanto más grande es n. Una k que no se estabiliza es la firma de lo exponencial.<\/p>"},"aplicar":{"titulo":"Tu serializador JSON","objetivo":"Escribir un serializador JSON recursivo, el problema donde la recursión es la mejor herramienta: datos anidados de profundidad desconocida.","reto":"<p>Crea <code>json.Json<\/code> con:<\/p><pre><code class=\"lang-java\">public static String escribir(Object o)<\/code><\/pre><p>Debe manejar:<\/p><ul><li><code>null<\/code> → <code>null<\/code><\/li><li><code>String<\/code> → entre comillas, escapando <code>\"<\/code>, <code>\\<\/code> y los saltos de línea<\/li><li><code>Number<\/code> y <code>Boolean<\/code> → tal cual<\/li><li><code>Map&lt;String, ?&gt;<\/code> → objeto <code>{\"clave\":valor,...}<\/code><\/li><li><code>List&lt;?&gt;<\/code> → array <code>[valor,...]<\/code><\/li><li>cualquier otra cosa → <code>IllegalArgumentException<\/code><\/li><\/ul><p>Después añade <code>toMap()<\/code> a <code>Habito<\/code> y a <code>Registro<\/code>, y genera el JSON de todo tu tracker: la lista de hábitos, cada uno con sus registros.<\/p><p>Prueba de oro: <code>escribir(mapa)<\/code>, donde <code>mapa<\/code> tiene listas dentro de mapas dentro de listas (3 niveles).<\/p>","hecho":["La prueba de 3 niveles produce un JSON válido (pégalo en cualquier validador JSON).","Un nombre con comillas, <code>Gym \"pesado\"<\/code>, sale escapado correctamente.","El JSON del tracker completo se genera con una sola llamada."],"minima":"<p>Sin escapado: solo <code>String<\/code>, <code>Number<\/code> y <code>Map<\/code> (sin listas).<\/p>","pista1":"<p>Un único método con una cadena de <code>instanceof<\/code>. Los casos base son los valores simples (<code>String<\/code>, <code>Number<\/code>, <code>Boolean<\/code>, null). El paso recursivo: para cada valor dentro de un <code>Map<\/code> o una <code>List<\/code>, llamas a <code>escribir<\/code> otra vez. La forma del código copia la forma de los datos.<\/p>","pista2":"<p>Pasa un <code>StringBuilder<\/code> hacia abajo: <code>escribir(Object o, StringBuilder sb)<\/code>. Así no creas Strings intermedios (la lección de la semana 0). Para las comas, un <code>boolean primero = true;<\/code> y, antes de cada elemento, <code>if (!primero) sb.append(','); primero = false;<\/code>.<\/p>","pista3":"<p>Para escapar, recorre los caracteres: <code>\"<\/code> → <code>\\\"<\/code>, <code>\\<\/code> → <code>\\\\<\/code>, salto de línea → <code>\\n<\/code> (dos caracteres: barra y n). En los checks usa <code>LinkedHashMap<\/code>, no <code>Map.of<\/code>: <code>Map.of<\/code> no garantiza el orden de las claves y tus checks fallarían al azar. Pattern matching de Java 21: <code>if (o instanceof Map&lt;?, ?&gt; m) { ... }<\/code>.<\/p>"},"explica":{"reto":"<p>Explica qué ocurre en memoria cuando una función se llama a sí misma y por qué existe <code>StackOverflowError<\/code>. Dibuja el árbol de llamadas de <code>fib(5)<\/code> y explica qué cambia con la memoización.<\/p>","guia":["Marcos de pila: qué contiene cada uno y cuándo se libera.","Caso base: por qué sin él la pila se desborda.","Tus números de profundidad máxima.","El árbol de <code>fib(5)<\/code>: ¿cuántas veces se calcula <code>fib(2)<\/code>? ¿Y con memoización?"]}},"bloque":2,"titulo":"Recursión","resumen":"Una función que se llama a sí misma deja de dar miedo cuando ves la pila de llamadas que hay debajo. Esta semana aprendes una receta de dos preguntas, mides los límites reales de tu JVM y escribes el serializador JSON que necesitará tu API.","sabes":["Métodos que llaman a otros métodos.","Pilas (semana 7) y listas enlazadas (semana 6).","Tu <code>MiHashMap<\/code> (semana 8)."],"nuevo":["La receta: caso base + paso recursivo.","La pila de llamadas real (marcos de pila) y <code>StackOverflowError<\/code>.","Memoización: recordar resultados para no repetir trabajo.","Recorrer estructuras anidadas de profundidad desconocida."],"objetivos":["Escribir 4 funciones recursivas siguiendo la receta.","Medir la profundidad máxima de tu pila y el efecto de la memoización.","Convertir cualquier objeto del tracker a JSON con tu propio código."],"tracker":"<code>Json.escribir(Object)<\/code>: serializador JSON propio (lo usará tu API)."},{"n":10,"sesiones":{"construir":{"titulo":"MiArbol&lt;K, V&gt;","objetivo":"Implementar un árbol binario de búsqueda genérico con operaciones recursivas.","reto":"<p>Crea <code>estructuras.MiArbol&lt;K extends Comparable&lt;? super K&gt;, V&gt;<\/code> con un <code>Nodo<\/code> (clave, valor, izq, der):<\/p><ul><li><code>put(K, V)<\/code> (si la clave existe, reemplaza el valor)<\/li><li><code>V get(K)<\/code> y <code>boolean containsKey(K)<\/code><\/li><li><code>K min()<\/code> y <code>K max()<\/code><\/li><li><code>int altura()<\/code> (árbol vacío: 0; un solo nodo: 1)<\/li><li><code>MiLista&lt;K&gt; enOrden()<\/code>: las claves ordenadas<\/li><li><code>MiLista&lt;K&gt; rango(K desde, K hasta)<\/code>: las claves del rango, <strong>sin visitar ramas que no pueden contenerlas<\/strong><\/li><\/ul><p>Checks: inserta 15, 10, 20, 8, 12, 17 y 25, y comprueba <code>enOrden<\/code>, <code>altura<\/code> (= 3), <code>min<\/code>, <code>max<\/code> y <code>rango(11, 18)<\/code>.<\/p>","hecho":["Todos los checks con el árbol de 7 nodos pasan.","<code>rango<\/code> no entra en ramas imposibles (cuenta los nodos visitados).","Insertar una clave repetida no crea un nodo nuevo."],"minima":"<p><code>put<\/code>, <code>get<\/code> y <code>enOrden<\/code>.<\/p>","pista1":"<p>En cada nodo hay tres casos: la clave es menor (ve a la izquierda), mayor (ve a la derecha) o igual (reemplaza el valor). Si llegas a null, ese es el sitio del nodo nuevo.<\/p>","pista2":"<p><code>enOrden<\/code>: recorre la izquierda, añade el nodo, recorre la derecha (recursivo). <code>altura(n)<\/code>: si n es null, 0; si no, <code>1 + Math.max(altura(n.izq), altura(n.der))<\/code>. <code>rango<\/code>: baja por la izquierda solo si <code>desde &lt; n.clave<\/code>, y por la derecha solo si <code>hasta &gt; n.clave<\/code>.<\/p>","pista3":"<p>El truco del <code>put<\/code> recursivo es devolver el nodo:<\/p><pre><code class=\"lang-java\">private Nodo&lt;K, V&gt; put(Nodo&lt;K, V&gt; n, K k, V v) {\n    if (n == null) { tamano++; return new Nodo&lt;&gt;(k, v); }\n    int c = k.compareTo(n.clave);\n    if (c &lt; 0) n.izq = put(n.izq, k, v);\n    else if (c &gt; 0) n.der = put(n.der, k, v);\n    else n.valor = v;\n    return n;\n}\n// public void put(K k, V v) { raiz = put(raiz, k, v); }<\/code><\/pre>"},"medir":{"titulo":"El peor caso que te espera","objetivo":"Medir cómo la forma del árbol (su altura) decide su velocidad, y compararlo con TreeMap y HashMap.","reto":"<ol><li><strong>Altura:<\/strong> inserta 10 000 claves en tu árbol en orden aleatorio y en orden creciente. Apunta la altura de cada uno y compárala con log₂(10 000) ≈ 13,3.<\/li><li><strong>Velocidad:<\/strong> 10 000 <code>get<\/code> aleatorios en cada uno de los dos árboles.<\/li><li><strong>Contra la JDK:<\/strong> <code>get<\/code> de 1 000 000 de claves en tu árbol (aleatorio), en <code>TreeMap<\/code> y en <code>HashMap<\/code>.<\/li><\/ol><p>Si con datos ordenados ves un <code>StackOverflowError<\/code>, enhorabuena: has reproducido el peor caso. Usa 5 000 claves o sube <code>-Xss<\/code> (semana 9).<\/p>","hecho":["Las dos alturas apuntadas y comparadas con log₂(n).","Sabes cuántas veces más lento es el árbol degenerado.","Sabes quién gana en <code>get<\/code>, y qué ofrece a cambio el que pierde."],"minima":"<p>Solo el punto 1 con 1 000 claves.<\/p>","pista1":"<p>Con datos aleatorios, la altura sale de unas 2-3 veces log₂(n): entre 25 y 35 para 10 000 claves. Con datos ordenados, cada nodo nuevo va siempre a la derecha: el árbol es una lista enlazada de altura n.<\/p>","pista2":"<p><code>TreeMap<\/code> es un árbol rojo-negro: después de cada inserción hace rotaciones para mantener la altura por debajo de 2·log₂(n+1), pase lo que pase. No tienes que implementarlo, solo entender la idea: pagar un poco en cada inserción para no caer nunca en el peor caso.<\/p>","pista3":"<p><code>HashMap<\/code> gana en <code>get<\/code> (O(1) frente a O(log n)), pero no tiene orden: no puede darte el mínimo, el máximo ni un rango sin recorrerlo todo. Un árbol te da orden a cambio de un factor log n.<\/p>"},"aplicar":{"titulo":"Consultas por rango de fechas","objetivo":"Indexar los registros por fecha en un árbol para responder consultas por rango, y descubrir el peor caso en tu propio tracker.","reto":"<ol><li>Crea <code>tracker.IndiceTemporal<\/code> con <code>MiArbol&lt;LocalDate, MiLista&lt;Registro&gt;&gt;<\/code> y estas consultas:<ul><li><code>entre(LocalDate desde, LocalDate hasta)<\/code>: registros del rango, ordenados por fecha<\/li><li><code>primeraFecha()<\/code> y <code>ultimaFecha()<\/code><\/li><li><code>resumenMensual(YearMonth mes)<\/code>: por hábito, los días hechos en ese mes<\/li><\/ul><\/li><li>Carga un año de registros generados <strong>día a día, en orden<\/strong>, como llegan en la vida real. Imprime la altura del árbol.<\/li><li><strong>Giro final:<\/strong> acabas de reproducir el peor caso en tu propio tracker. Cambia <code>IndiceTemporal<\/code> para que use <code>TreeMap<\/code> y comprueba que todo sigue funcionando (<code>subMap(desde, true, hasta, true)<\/code> te da el rango).<\/li><li>Escribe en la libreta una tabla de decisión: ¿qué índice usas para cada consulta del tracker (<code>HashMap<\/code> o árbol) y por qué?<\/li><\/ol>","hecho":["<code>entre<\/code> devuelve los registros ordenados, probado con checks.","Has visto la altura del árbol con datos en orden (≈365).","<code>IndiceTemporal<\/code> funciona con <code>TreeMap<\/code> y tu tabla de decisión está en la libreta."],"minima":"<p>Solo <code>entre<\/code> con tu árbol y datos en orden aleatorio.<\/p>","pista1":"<p><code>LocalDate<\/code> es <code>Comparable&lt;ChronoLocalDate&gt;<\/code>. Por eso definiste el límite como <code>Comparable&lt;? super K&gt;<\/code> (semana 3): aquí ves para qué servía.<\/p>","pista2":"<p>Para <code>entre<\/code>: usa tu <code>rango(desde, hasta)<\/code> para obtener las fechas y después <code>get<\/code> de cada una para juntar sus registros. Como salen del recorrido en orden, ya vienen ordenados.<\/p>","pista3":"<p>Tabla de decisión típica: \"¿hice gym el día X?\" → <code>HashMap<\/code> (O(1)). \"¿Qué hice entre X e Y?\", \"primera y última fecha\", \"informe mensual\" → árbol (O(log n + k)). Y la conclusión del giro: con datos que llegan ordenados, un árbol sin equilibrar es una lista enlazada disfrazada.<\/p>"},"explica":{"reto":"<p>¿Cuándo usarías un árbol en lugar de un <code>HashMap<\/code>? Explica por qué insertar datos ya ordenados destroza un árbol de búsqueda simple, y cómo lo evita <code>TreeMap<\/code> (solo la idea, sin los detalles del rojo-negro).<\/p>","guia":["El invariante izquierda &lt; nodo &lt; derecha y el recorrido en orden.","La altura manda: tus números con datos aleatorios y ordenados.","Orden y rangos frente a O(1): tu tabla de decisión.","La idea del equilibrado: pagar un poco en cada inserción."]}},"bloque":2,"titulo":"Árboles binarios de búsqueda","resumen":"Juntas nodos y recursión en la estructura que mantiene los datos ordenados. Y descubres que los datos de tu tracker llegan justo en el peor orden posible para un árbol simple, y por qué existe TreeMap.","sabes":["Nodos (semana 6) y recursión (semana 9).","<code>Comparable&lt;? super T&gt;<\/code> (semana 3).","Tu <code>MiHashMap<\/code> (semana 8)."],"nuevo":["El invariante del árbol de búsqueda: izquierda &lt; nodo &lt; derecha.","Recorridos: el recorrido en orden da los elementos ordenados.","Altura y equilibrio: importan más que el número de nodos.","Consultas por rango."],"objetivos":["Tener un <code>MiArbol&lt;K, V&gt;<\/code> con inserción, búsqueda, recorrido y rangos.","Medir la altura con datos aleatorios y con datos ordenados.","Responder \"¿qué hice entre el 1 y el 15 de marzo?\" sin recorrerlo todo."],"tracker":"<code>IndiceTemporal<\/code>: consultas por rango de fechas."},{"n":11,"sesiones":{"construir":{"titulo":"Un contrato, dos motores","objetivo":"Definir el DAO de hábitos y registros con dos implementaciones (memoria y fichero) que pasan las mismas pruebas.","reto":"<ol><li>Define:<\/li><\/ol><pre><code class=\"lang-java\">public interface HabitoDao {\n    Habito guardar(Habito h);              // crea o reemplaza por id\n    Optional&lt;Habito&gt; buscar(String id);\n    List&lt;Habito&gt; listar();\n    boolean borrar(String id);\n}<\/code><\/pre><p>y lo mismo para <code>RegistroDao<\/code> (con <code>listarPorHabito(String habitoId)<\/code>).<\/p><ol start=\"2\"><li><code>HabitoDaoMemoria<\/code>: sobre tu <code>MiHashMap<\/code>.<\/li><li><code>HabitoDaoFichero<\/code>: guarda en <code>datos/habitos.csv<\/code> (una línea por hábito). Al crearse, carga el fichero si existe; en cada cambio, lo reescribe entero.<\/li><li><strong>Prueba de contrato:<\/strong> un método <code>probarContrato(HabitoDao dao)<\/code> con 8 checks, que llamas una vez con cada implementación.<\/li><\/ol><p>El <code>Objetivo<\/code> de cada hábito también hay que guardarlo como texto, por ejemplo <code>DIAS_MINIMOS:4<\/code> o <code>MEDIA_MINIMA:7.0<\/code>. Crea <code>Objetivo.desdeTexto(String)<\/code> y <code>aTexto()<\/code>.<\/p>","hecho":["<code>probarContrato<\/code> pasa con las dos implementaciones sin cambiar ni una línea.","Si descartas un <code>HabitoDaoFichero<\/code> y creas otro, los hábitos siguen ahí.","Un hábito con objetivo <code>MediaMinima(7.0)<\/code> se guarda y se recupera igual."],"minima":"<p>Solo <code>HabitoDaoMemoria<\/code> y la prueba de contrato.<\/p>","pista1":"<p><code>Files.createDirectories(ruta.getParent())<\/code>, <code>Files.readAllLines(ruta)<\/code> y <code>Files.write(ruta, lineas)<\/code>. Con <code>Files.exists(ruta)<\/code> sabes si es la primera vez.<\/p>","pista2":"<p>Formato: <code>id;nombre;tipo;objetivo<\/code>. ¿Y si un nombre contiene <code>;<\/code>? Tienes dos opciones: escaparlo o prohibirlo en el constructor de <code>Habito<\/code>. Prohibirlo es un invariante más, y te ahorra el problema (semana 1).<\/p>","pista3":"<p><code>desdeTexto<\/code> es una pequeña fábrica: separa por <code>:<\/code> y, con un <code>switch<\/code> sobre la primera parte, crea la implementación correcta (<code>case \"DIAS_MINIMOS\" -&gt; new DiasMinimos(Integer.parseInt(partes[1]));<\/code>). Es el único sitio del código donde se permite un switch por tipo, porque es donde nacen los objetos.<\/p>"},"medir":{"titulo":"Reescribir todo frente a añadir al final","objetivo":"Medir dos formas de guardar registros en fichero y entender por qué las bases de datos usan logs append-only.","reto":"<p>Implementa dos versiones de <code>RegistroDao<\/code> en fichero:<\/p><ul><li><strong>Reescritura:<\/strong> cada <code>guardar<\/code> reescribe el fichero entero con todos los registros.<\/li><li><strong>Append-only:<\/strong> cada <code>guardar<\/code> añade una línea al final: <code>Files.writeString(ruta, linea + \"\\n\", StandardOpenOption.CREATE, StandardOpenOption.APPEND)<\/code>.<\/li><\/ul><p>Con el Complejómetro, inserta n registros uno a uno (n = 1 000, 2 000 y 4 000). Compara también con <code>RegistroDaoMemoria<\/code>.<\/p><p>Después piensa en la pega del append-only: ¿cómo borras un registro? (Pista: no lo borras.)<\/p>","hecho":["La k de las dos versiones de fichero apuntada (≈2 frente a ≈1).","El tiempo por operación en memoria frente a fichero.","Has diseñado (en papel o en código) cómo borrar en un log append-only."],"minima":"<p>Reescritura frente a append-only con n = 2 000 y 4 000.<\/p>","pista1":"<p>Reescribir n registros en cada inserción supone 1 + 2 + … + n líneas escritas: O(n²) en total. Añadir una línea: O(1) por inserción.<\/p>","pista2":"<p>Para borrar en append-only se añade una línea \"lápida\": <code>BORRADO;id<\/code>. Al cargar, se lee el log entero de principio a fin y se aplican las operaciones en orden. Es la idea del Write-Ahead Log de PostgreSQL y del log de Kafka.<\/p>","pista3":"<p>La pega: el log crece para siempre y cargar se vuelve lento. La solución es la <strong>compactación<\/strong>: de vez en cuando se reescribe el fichero con solo el estado actual. Es lo mismo que hace tu reescritura, pero de vez en cuando en lugar de en cada operación.<\/p>"},"aplicar":{"titulo":"Cambia el motor sin tocar el coche","objetivo":"Crear la capa de servicio del tracker, que solo depende de interfaces, y elegir el almacenamiento al arrancar.","reto":"<ol><li>Crea <code>TrackerService<\/code>, que recibe los DAO <strong>por el constructor<\/strong>:<\/li><\/ol><pre><code class=\"lang-java\">public TrackerService(HabitoDao habitos, RegistroDao registros)<\/code><\/pre><p>Con los métodos <code>crearHabito(...)<\/code>, <code>marcar(habitoId, fecha, valor)<\/code>, <code>desmarcar(habitoId, fecha)<\/code> e <code>informeSemanal(LocalDate lunes)<\/code> (la tabla de la semana 2).<\/p><ol start=\"2\"><li>En <code>tracker.Main<\/code>, elige la implementación según un argumento: <code>java tracker.Main memoria<\/code> o <code>java tracker.Main fichero<\/code>.<\/li><li>Ejecuta con <code>fichero<\/code>, crea tus hábitos reales, marca 3 días, cierra, vuelve a abrir e imprime el informe.<\/li><\/ol>","hecho":["<code>TrackerService<\/code> no contiene ningún <code>new<\/code> de un DAO ni la palabra \"fichero\".","Pasar de memoria a fichero solo cambia una línea de <code>Main<\/code>.","Tus datos sobreviven a reiniciar el programa."],"minima":"<p><code>TrackerService<\/code> con <code>marcar<\/code> e <code>informeSemanal<\/code> usando el DAO en memoria.<\/p>","pista1":"<p>Esto es inyección de dependencias sin frameworks: quien crea el servicio decide qué DAO le pasa. Spring hace exactamente esto, de forma automática.<\/p>","pista2":"<p>Para que el informe funcione con los dos DAO, pide los registros con <code>registros.listarPorHabito(id)<\/code> y filtra la semana con tu <code>Rango&lt;LocalDate&gt;<\/code> (semana 3) o, mejor, construye un <code>IndiceRegistros<\/code> (semana 8) al arrancar.<\/p>","pista3":"<p><code>Main<\/code>:<\/p><pre><code class=\"lang-java\">HabitoDao hd = args.length &gt; 0 &amp;&amp; args[0].equals(\"fichero\")\n        ? new HabitoDaoFichero(Path.of(\"datos/habitos.csv\"))\n        : new HabitoDaoMemoria();\n// lo mismo para RegistroDao\nTrackerService servicio = new TrackerService(hd, rd);<\/code><\/pre>"},"explica":{"reto":"<p>¿Qué problema resuelve el patrón DAO? Imagina que mañana el tracker tiene que guardar en una base de datos de verdad: ¿qué clases cambiarían, cuáles no, y por qué?<\/p>","guia":["Separar qué se guarda de cómo se guarda.","La prueba de contrato como garantía.","Inyección de dependencias por constructor.","Append-only frente a reescritura: tus números y la idea de las bases de datos."]}},"bloque":3,"titulo":"Patrón DAO y persistencia en ficheros","resumen":"Tu tracker deja de olvidarlo todo al cerrarse. Separas el \"qué guardo\" del \"cómo lo guardo\", y mides la diferencia entre reescribir un fichero entero y añadir al final, que es como funcionan las bases de datos por dentro.","sabes":["Interfaces y polimorfismo (semana 2).","<code>MiHashMap<\/code> (semana 8).","Excepciones y try/catch."],"nuevo":["El patrón DAO (Data Access Object).","Leer y escribir ficheros con <code>java.nio.file<\/code>.","Pruebas de contrato: las mismas pruebas para varias implementaciones.","Inyección de dependencias a mano, sin frameworks.","Log append-only: la base de las bases de datos."],"objetivos":["Tener dos implementaciones de <code>HabitoDao<\/code> que pasan exactamente las mismas pruebas.","Medir reescribir todo frente a añadir al final.","Cerrar el tracker, volver a abrirlo y que tus datos sigan ahí."],"tracker":"Capa de persistencia (DAO en memoria y en fichero) y <code>TrackerService<\/code>."},{"n":12,"sesiones":{"construir":{"titulo":"El bus de eventos","objetivo":"Construir un sistema de publicación de eventos (Observer) y crear el mapa de patrones de tu tracker.","reto":"<p><strong>Parte 1. Mapa de patrones (10 min).<\/strong> En la libreta, identifica en tu código:<\/p><ul><li><strong>Strategy:<\/strong> algo que elige un comportamiento intercambiable.<\/li><li><strong>Command:<\/strong> acciones convertidas en objetos.<\/li><li><strong>Factory:<\/strong> un método que decide qué clase crear.<\/li><li><strong>DAO:<\/strong> acceso a datos detrás de una interfaz.<\/li><\/ul><p><strong>Parte 2. Bus de eventos.<\/strong><\/p><pre><code class=\"lang-java\">public interface Evento {}\npublic record HabitoMarcado(String habitoId, LocalDate fecha, double valor) implements Evento {}\npublic record HabitoDesmarcado(String habitoId, LocalDate fecha) implements Evento {}\n\npublic interface Oyente { void recibir(Evento e); }\n\npublic final class BusEventos {\n    public void suscribir(Oyente o) { ... }\n    public void publicar(Evento e) { ... } // avisa a todos los oyentes\n}<\/code><\/pre><p>Cada oyente decide qué eventos le interesan con pattern matching: <code>if (e instanceof HabitoMarcado m) { ... m.habitoId() ... }<\/code>.<\/p>","hecho":["Los 4 patrones localizados, con el nombre de la clase de tu código.","Un oyente de prueba recibe los eventos publicados (con checks).","Un oyente que lanza una excepción no impide que los demás reciban el evento."],"minima":"<p>Solo la parte 1, o solo el bus con un oyente que imprime.<\/p>","pista1":"<p>Strategy → <code>Objetivo<\/code>. Command → <code>Comando<\/code> del historial. Factory → <code>Objetivo.desdeTexto<\/code>. DAO → <code>HabitoDao<\/code>. Llevas usando patrones desde la semana 2.<\/p>","pista2":"<p>Un <code>record<\/code> es una clase inmutable en una línea: Java genera el constructor, los getters (<code>habitoId()<\/code>), <code>equals<\/code>, <code>hashCode<\/code> y <code>toString<\/code>. Es exactamente lo que escribiste a mano en <code>Registro<\/code> en la semana 1.<\/p>","pista3":"<p>Para que un oyente roto no afecte al resto:<\/p><pre><code class=\"lang-java\">public void publicar(Evento e) {\n    for (Oyente o : oyentes) {\n        try { o.recibir(e); }\n        catch (RuntimeException ex) { System.err.println(\"Oyente falló: \" + ex.getMessage()); }\n    }\n}<\/code><\/pre>"},"medir":{"titulo":"El coste de cambio","objetivo":"Medir con git cuánto cuesta añadir una funcionalidad con y sin eventos, y el coste en tiempo de publicar un evento.","reto":"<p><strong>Funcionalidad:<\/strong> \"cuando un hábito llegue a 7 días seguidos, imprime <code>RACHA 7: gym<\/code>\".<\/p><ol><li>Haz un commit del estado actual. En una rama <code>sin-eventos<\/code>, impleméntala <strong>sin<\/strong> el bus, modificando directamente <code>TrackerService.marcar<\/code>. Apunta el resultado de <code>git diff --stat<\/code>.<\/li><li>Vuelve a la rama principal. En una rama <code>con-eventos<\/code>, impleméntala con un oyente nuevo y una línea para suscribirlo. Apunta <code>git diff --stat<\/code>.<\/li><li><strong>Rendimiento:<\/strong> publica 1 000 000 de eventos con 0, 1, 10 y 100 oyentes. Apunta los ns por evento.<\/li><\/ol>","hecho":["Los dos <code>git diff --stat<\/code> apuntados: archivos modificados frente a archivos nuevos.","La tabla de ns por evento según el número de oyentes.","Una frase con tu conclusión: ¿cuándo compensa el bus?"],"minima":"<p>Solo los pasos 1 y 2.<\/p>","pista1":"<p>Fíjate menos en el número de líneas y más en esto: ¿has <strong>modificado<\/strong> código que ya funcionaba o solo has <strong>añadido<\/strong> código nuevo? Modificar es donde se cuelan los bugs (abierto/cerrado, semana 2).<\/p>","pista2":"<p>El coste de publicar debería crecer de forma lineal con los oyentes: es un bucle que llama a cada uno. Incluso con 100 oyentes triviales hablamos de cientos de nanosegundos o pocos microsegundos por evento: irrelevante para el tracker.<\/p>","pista3":"<p>La cara oculta del Observer: el flujo del programa ya no se lee de arriba abajo. Para saber qué pasa al marcar un hábito tienes que buscar quién está suscrito. Con 3 oyentes es comodísimo; con 50 repartidos por el código, depurar es un infierno. Eso también es coste de cambio.<\/p>"},"aplicar":{"titulo":"Rachas, logros y auditoría","objetivo":"Conectar el tracker al bus de eventos con tres oyentes reales.","reto":"<ol><li><code>TrackerService<\/code> publica <code>HabitoMarcado<\/code> y <code>HabitoDesmarcado<\/code> en lugar de hacer él todo el trabajo.<\/li><li>Crea tres oyentes:<ul><li><code>RachaOyente<\/code>: mantiene la racha actual de cada hábito (usa tu <code>IndiceRegistros<\/code> de la semana 8) y avisa al llegar a 7, 30 y 100.<\/li><li><code>LogroOyente<\/code>: desbloquea logros del tracker (\"primera semana perfecta\", \"10 días de gym\"). Sí, como los de esta web.<\/li><li><code>AuditoriaOyente<\/code>: escribe cada evento en <code>datos/auditoria.log<\/code> (append-only, semana 11).<\/li><\/ul><\/li><li>Conecta todo en <code>Main<\/code> y prueba un escenario completo de 10 días.<\/li><\/ol>","hecho":["<code>TrackerService.marcar<\/code> no sabe nada de rachas, logros ni auditoría.","El log de auditoría tiene una línea por evento, en orden.","El escenario de 10 días dispara el aviso de racha 7 en el día correcto (con un check)."],"minima":"<p><code>RachaOyente<\/code> conectado al servicio.<\/p>","pista1":"<p>Orden de construcción en <code>Main<\/code>: crea el bus, crea y suscribe los oyentes, y crea el servicio pasándole el bus. El servicio solo conoce el bus, no a los oyentes.<\/p>","pista2":"<p><code>RachaOyente<\/code> necesita saber qué días están hechos. Puede tener su propio <code>IndiceRegistros<\/code>, que actualiza con cada evento (<code>HabitoMarcado<\/code> → agregar, <code>HabitoDesmarcado<\/code> → quitar), y llamar a <code>rachaActual<\/code> tras cada cambio.<\/p>","pista3":"<p>Para que el aviso de 7 días salga solo una vez, guarda la última racha avisada de cada hábito en un <code>MiHashMap&lt;String, Integer&gt;<\/code> y avisa solo si la racha nueva alcanza un umbral que todavía no habías avisado.<\/p>"},"explica":{"reto":"<p>Strategy, Command y Observer: explica con ejemplos de TU tracker qué problema resuelve cada uno. Después, pon un ejemplo concreto de cuándo usar un patrón sería sobreingeniería.<\/p>","guia":["Strategy: el comportamiento cambia sin cambiar la clase (<code>Objetivo<\/code>).","Command: acciones como objetos que se pueden guardar y deshacer.","Observer: avisar sin conocer al receptor (tus diffs de git).","El coste oculto de cada patrón, y cuándo no compensa."]}},"bloque":3,"titulo":"Patrones que ya usas (y Observer)","resumen":"Llevas semanas aplicando patrones de diseño sin ponerles nombre. Esta semana los identificas en tu propio código, añades uno nuevo (Observer) y mides lo único que importa de un patrón: cuánto cuesta cambiar el código.","sabes":["<code>Objetivo<\/code> (semana 2), <code>Comando<\/code> (semana 7), el DAO y <code>desdeTexto<\/code> (semana 11).","Interfaces y composición."],"nuevo":["Strategy, Command y Factory: ponerle nombre a lo que ya hiciste.","Observer: avisar a quien le interese sin conocerlo.","Records de Java para eventos inmutables.","Medir el coste de cambio (archivos y líneas tocadas)."],"objetivos":["Tener un mapa de los patrones de tu tracker.","Construir un bus de eventos y conectarle 3 oyentes.","Comparar con <code>git diff --stat<\/code> cuánto cuesta añadir una funcionalidad con y sin eventos."],"tracker":"<code>BusEventos<\/code> con oyentes de rachas, logros y auditoría."},{"n":13,"sesiones":{"construir":{"titulo":"Un servidor HTTP en 50 líneas","objetivo":"Construir un servidor HTTP mínimo con sockets que lee la petición y responde a mano.","reto":"<p>Crea <code>http.ServidorCrudo<\/code>, escuchando en el puerto 8080:<\/p><ol><li>Un bucle infinito de <code>accept()<\/code>.<\/li><li>Lee la <strong>línea de petición<\/strong> (<code>GET /hola HTTP/1.1<\/code>) y las <strong>cabeceras<\/strong> hasta la línea vacía. Imprímelas por consola.<\/li><li>Responde a mano:<\/li><\/ol><pre><code>HTTP/1.1 200 OK\\r\\n\nContent-Type: text/plain; charset=utf-8\\r\\n\nContent-Length: 19\\r\\n\nConnection: close\\r\\n\n\\r\\n\n¡Hola desde Java!<\/code><\/pre><ol start=\"4\"><li>Rutas: <code>/hola<\/code> → texto; cualquier otra → <code>404 Not Found<\/code> con un mensaje.<\/li><\/ol><p>Pruébalo con el navegador y con <code>curl -v http://localhost:8080/hola<\/code>.<\/p>","hecho":["El navegador muestra tu texto, con la tilde y la ¡ bien.","<code>curl -v<\/code> muestra tus cabeceras exactas.","Una ruta inventada devuelve 404."],"minima":"<p>Responder \"hola\" a cualquier petición, sin leer las cabeceras.<\/p>","pista1":"<pre><code class=\"lang-java\">try (ServerSocket server = new ServerSocket(8080)) {\n    while (true) {\n        try (Socket s = server.accept()) {\n            BufferedReader in = new BufferedReader(\n                new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));\n            String lineaPeticion = in.readLine();\n            String linea;\n            while ((linea = in.readLine()) != null &amp;&amp; !linea.isEmpty()) { /* cabecera */ }\n            // responder...\n        }\n    }\n}<\/code><\/pre>","pista2":"<p>Escribe bytes, no texto: <code>byte[] cuerpo = texto.getBytes(StandardCharsets.UTF_8);<\/code> y en las cabeceras pon <code>Content-Length: <\/code> + <code>cuerpo.length<\/code>. Envía primero las cabeceras (también con <code>getBytes<\/code>) y luego el cuerpo por <code>s.getOutputStream()<\/code>, y haz <code>flush()<\/code>.<\/p>","pista3":"<p>Trampa clásica: <code>Content-Length<\/code> cuenta <strong>bytes<\/strong>, no caracteres. \"¡Hola desde Java!\" tiene 17 caracteres, pero la <code>¡<\/code> ocupa 2 bytes en UTF-8: son 18 bytes, y 19 con un salto de línea al final. Si usas <code>texto.length()<\/code>, el navegador cortará el final. Por eso el ejemplo dice 19.<\/p>"},"medir":{"titulo":"Un hilo, diez hilos, hilos virtuales","objetivo":"Construir un generador de carga y medir cómo escala tu servidor con distintos modelos de hilos.","reto":"<ol><li>Simula trabajo lento: añade <code>Thread.sleep(50)<\/code> antes de responder (como si consultara una base de datos).<\/li><li>Crea <code>http.Carga<\/code>: lanza N peticiones concurrentes con <code>HttpClient.sendAsync<\/code>, espera a todas y mide el tiempo total y las peticiones por segundo.<\/li><li>Mide con N = 200 tres versiones del servidor:<ul><li><strong>(a)<\/strong> un solo hilo: atiende dentro del bucle de <code>accept<\/code>.<\/li><li><strong>(b)<\/strong> <code>Executors.newFixedThreadPool(10)<\/code>: cada socket se atiende en el pool.<\/li><li><strong>(c)<\/strong> <code>Executors.newVirtualThreadPerTaskExecutor()<\/code>.<\/li><\/ul><\/li><\/ol>","hecho":["La tabla con el tiempo total y las peticiones por segundo de las 3 versiones.","Sabes calcular de antemano cuánto deberían tardar (a) y (b).","Una frase sobre qué cambia con los hilos virtuales."],"minima":"<p>Solo (a) frente a (c) con N = 50.<\/p>","pista1":"<pre><code class=\"lang-java\">HttpClient cliente = HttpClient.newBuilder()\n        .version(HttpClient.Version.HTTP_1_1).build();\nHttpRequest req = HttpRequest.newBuilder(URI.create(\"http://localhost:8080/hola\")).build();\nList&lt;CompletableFuture&lt;HttpResponse&lt;String&gt;&gt;&gt; futuros = new ArrayList&lt;&gt;();\nfor (int i = 0; i &lt; n; i++)\n    futuros.add(cliente.sendAsync(req, HttpResponse.BodyHandlers.ofString()));\nCompletableFuture.allOf(futuros.toArray(new CompletableFuture[0])).join();<\/code><\/pre>","pista2":"<p>En (b) y (c), el bucle de <code>accept<\/code> no atiende: entrega el socket al executor. Ojo: el <code>try (Socket s = ...)<\/code> ya no puede estar en el bucle, porque cerraría el socket antes de que el otro hilo lo use. El <code>try<\/code> va dentro de la tarea: <code>Socket s = server.accept(); executor.submit(() -&gt; atender(s));<\/code>.<\/p>","pista3":"<p>Cálculo: (a) 200 × 50 ms = 10 s. (b) 200 / 10 hilos × 50 ms = 1 s. (c) cada petición tiene su propio hilo virtual: unos 50-100 ms en total. Un hilo virtual que duerme o espera E/S no ocupa un hilo del sistema operativo, así que puedes tener miles. Es la gran novedad de Java 21 para servidores.<\/p>"},"aplicar":{"titulo":"El tracker en el navegador","objetivo":"Conectar tu servidor al TrackerService y servir el informe semanal con parámetros.","reto":"<p>Con tu servidor (la versión con hilos virtuales) y el <code>TrackerService<\/code> de la semana 11:<\/p><ul><li><code>GET /hoy<\/code> → el estado de cada hábito hoy (texto).<\/li><li><code>GET /semana?fecha=2026-12-07<\/code> → la tabla de la semana que contiene esa fecha.<\/li><li><code>GET /semana<\/code> sin fecha → la semana actual.<\/li><li>Fecha inválida (<code>?fecha=ayer<\/code>) → <code>400 Bad Request<\/code> con un mensaje que explique el formato esperado.<\/li><\/ul><p>Parsea tú mismo la ruta y la query string, sin librerías.<\/p>","hecho":["Las 3 URL funcionan en el navegador.","<code>?fecha=ayer<\/code> devuelve 400 con un mensaje útil, y el servidor sigue vivo.","Una petición mal formada no tumba el servidor."],"minima":"<p>Solo <code>GET /semana<\/code> con la semana actual.<\/p>","pista1":"<p>Separa la ruta de la query: <code>String[] partes = objetivo.split(\"\\\\?\", 2);<\/code>. La query son pares <code>clave=valor<\/code> separados por <code>&amp;<\/code>. Decodifica cada valor con <code>URLDecoder.decode(valor, StandardCharsets.UTF_8)<\/code>.<\/p>","pista2":"<p><code>LocalDate.parse(\"2026-12-07\")<\/code> lanza <code>DateTimeParseException<\/code> si el formato es incorrecto: atrápala y responde 400. El lunes de esa semana es <code>fecha.with(DayOfWeek.MONDAY)<\/code>.<\/p>","pista3":"<p>Envuelve todo <code>atender(socket)<\/code> en un <code>try/catch (Exception e)<\/code> que responda 500. Así un error en una petición nunca tumba el servidor. Imprime el error en tu consola, pero nunca envíes la traza al cliente.<\/p>"},"explica":{"reto":"<p>Explica qué viaja exactamente por el cable cuando escribes <code>localhost:8080/semana<\/code> en el navegador: línea de petición, cabeceras, línea vacía y cuerpo. ¿Por qué <code>Content-Length<\/code> cuenta bytes y no caracteres?<\/p>","guia":["Petición y respuesta, línea a línea (lo que viste en la consola y con curl).","<code>\\r\\n<\/code> y la línea vacía como separador.","UTF-8: caracteres frente a bytes (el ejemplo de la ¡).","Hilos: por qué un servidor de un solo hilo no escala (tus números)."]}},"bloque":4,"titulo":"HTTP por dentro: un servidor con sockets","resumen":"Antes de usar ninguna librería, ves los bytes. Montas un servidor HTTP con un ServerSocket, lo atacas con tu propio generador de carga y comparas un hilo, un pool de hilos y los hilos virtuales de Java 21.","sabes":["HTTP como usuario: GET, POST y códigos de estado (los servlets de AEM).","Leer y escribir ficheros (semana 11).","<code>TrackerService<\/code> (semana 11)."],"nuevo":["El formato real de una petición y una respuesta HTTP.","<code>ServerSocket<\/code>, <code>Socket<\/code> y streams de entrada y salida.","Hilos, pools de hilos e hilos virtuales (Java 21).","<code>java.net.http.HttpClient<\/code> para generar carga."],"objetivos":["Ver en tu navegador una página servida por un programa tuyo de unas 50 líneas.","Medir peticiones por segundo con 1 hilo, con 10 y con hilos virtuales.","Consultar el informe semanal del tracker desde el navegador."],"tracker":"El tracker responde por HTTP: <code>GET /hoy<\/code> y <code>GET /semana?fecha=...<\/code>."},{"n":14,"sesiones":{"construir":{"titulo":"Tu propio router","objetivo":"Construir un router que asocia método + patrón de ruta a un manejador, con parámetros de ruta.","reto":"<pre><code class=\"lang-java\">public record Peticion(String metodo, String ruta, Map&lt;String, String&gt; params,\n                       Map&lt;String, String&gt; query, String cuerpo) {}\npublic record Respuesta(int estado, Object cuerpo) {} // el cuerpo se serializa a JSON\npublic interface Manejador { Respuesta manejar(Peticion p); }\n\npublic final class Router {\n    public void registrar(String metodo, String patron, Manejador m) { ... }\n    public Respuesta resolver(String metodo, String ruta, ...) { ... }\n}<\/code><\/pre><ul><li><code>registrar(\"GET\", \"/habitos/{id}\", ...)<\/code>: los segmentos entre llaves capturan su valor en <code>params<\/code>.<\/li><li>Si la ruta existe pero con otro método → <strong>405<\/strong>. Si no existe → <strong>404<\/strong>. Los dos con un cuerpo JSON <code>{\"error\": \"...\"}<\/code>.<\/li><li>Arranca un <code>HttpServer<\/code> con un único contexto <code>/<\/code> que delega en el router, con un executor de hilos virtuales.<\/li><\/ul>","hecho":["<code>/habitos/gym<\/code> resuelve el patrón <code>/habitos/{id}<\/code> con <code>params.get(\"id\")<\/code> igual a <code>\"gym\"<\/code>.","<code>DELETE /habitos<\/code> (no registrado) da 405 y <code>/nada<\/code> da 404.","Las respuestas llevan <code>Content-Type: application/json; charset=utf-8<\/code>."],"minima":"<p>Un router sin parámetros (coincidencia exacta de ruta) con un endpoint.<\/p>","pista1":"<pre><code class=\"lang-java\">HttpServer server = HttpServer.create(new InetSocketAddress(8080), 0);\nserver.createContext(\"/\", exchange -&gt; { /* router */ });\nserver.setExecutor(Executors.newVirtualThreadPerTaskExecutor());\nserver.start();<\/code><\/pre><p>El método sale de <code>exchange.getRequestMethod()<\/code>, la ruta de <code>exchange.getRequestURI().getPath()<\/code> y la query de <code>getRawQuery()<\/code>.<\/p>","pista2":"<p>Coincidencia: divide el patrón y la ruta por <code>/<\/code>. Si tienen distinto número de segmentos, no coinciden. Recorre segmento a segmento: si el del patrón empieza por <code>{<\/code>, guarda el valor; si no, los dos deben ser iguales.<\/p>","pista3":"<p>Enviar la respuesta:<\/p><pre><code class=\"lang-java\">byte[] b = Json.escribir(r.cuerpo()).getBytes(StandardCharsets.UTF_8);\nexchange.getResponseHeaders().set(\"Content-Type\", \"application/json; charset=utf-8\");\nexchange.sendResponseHeaders(r.estado(), b.length);\ntry (OutputStream os = exchange.getResponseBody()) { os.write(b); }<\/code><\/pre><p>Para un 204 (sin cuerpo), pasa <code>-1<\/code> como longitud.<\/p>"},"medir":{"titulo":"La media miente: percentiles","objetivo":"Medir la latencia de tu API con percentiles y comparar el DAO en memoria con el de fichero.","reto":"<ol><li>Amplía tu <code>Carga<\/code> (semana 13) para guardar la latencia de <strong>cada<\/strong> petición (nanoTime al enviar y al recibir).<\/li><li>Ordena las latencias y calcula p50, p95, p99 y el máximo.<\/li><li>Lanza 2 000 peticiones, con 50 concurrentes, contra <code>GET /habitos/{id}/registros<\/code> con:<ul><li>el DAO en memoria<\/li><li>el DAO de fichero (append-only, que relee el log en cada consulta)<\/li><\/ul><\/li><li>Compara la media con el p99.<\/li><\/ol>","hecho":["La tabla de p50 / p95 / p99 / máximo / media de las dos configuraciones.","Sabes explicar qué significa \"p99 = 40 ms\".","Has encontrado la diferencia entre la media y el p99 en tus datos."],"minima":"<p>p50 y p99 de una sola configuración.<\/p>","pista1":"<p>Para limitar a 50 concurrentes, en lugar de lanzar las 2 000 a la vez, usa un <code>Semaphore(50)<\/code>: <code>acquire()<\/code> antes de enviar y <code>release()<\/code> cuando llega la respuesta (en <code>whenComplete<\/code>).<\/p>","pista2":"<p>Percentil p: ordena el array de latencias y coge la posición <code>(int) Math.ceil(p / 100.0 * n) - 1<\/code>. p99 significa \"el 99 % de las peticiones tardó esto o menos\".<\/p>","pista3":"<p>La media esconde los picos: 99 peticiones de 2 ms y 1 de 500 ms dan una media de 7 ms, pero ese usuario de 500 ms existe. En los juegos pasa igual: el DPS medio no te dice si mueres en el pico de daño del jefe. Las APIs serias se miden por su p99.<\/p>"},"aplicar":{"titulo":"Endpoints de lectura","objetivo":"Exponer el tracker en JSON con un diseño REST coherente.","reto":"<p>Implementa con tu router:<\/p><ul><li><code>GET /habitos<\/code> → la lista de hábitos.<\/li><li><code>GET /habitos/{id}<\/code> → un hábito, o <strong>404<\/strong> con <code>{\"error\": \"No existe el hábito 'xyz'\"}<\/code>.<\/li><li><code>GET /habitos/{id}/registros?desde=2026-12-01&amp;hasta=2026-12-31<\/code> → los registros del rango (usa tu <code>IndiceTemporal<\/code> de la semana 10). Sin fechas → los últimos 30 días.<\/li><li><code>GET /informe/semana?fecha=2026-12-07<\/code> → por cada hábito: su objetivo, los días hechos y si lo ha cumplido.<\/li><\/ul><p>Pruébalos todos con <code>curl<\/code> y guarda los comandos en un fichero <code>api.http<\/code> o en tu libreta.<\/p>","hecho":["Los 4 endpoints devuelven JSON válido.","Las fechas inválidas devuelven 400, no 500.","Un <code>desde<\/code> posterior a <code>hasta<\/code> devuelve 400 con un mensaje claro (tu <code>Rango<\/code> ya lo valida)."],"minima":"<p><code>GET /habitos<\/code> y <code>GET /habitos/{id}<\/code> con su 404.<\/p>","pista1":"<p>Diseño REST: las URLs son <strong>sustantivos<\/strong> (recursos) y el verbo lo pone el método HTTP. <code>/habitos/{id}/registros<\/code> se lee como \"los registros del hábito {id}\". Evita cosas como <code>/getRegistros?habito=gym<\/code>.<\/p>","pista2":"<p>Reutiliza tu validación: si <code>new Rango&lt;&gt;(desde, hasta)<\/code> lanza <code>IllegalArgumentException<\/code>, conviértela en un 400 dentro del manejador. Haz lo mismo con <code>DateTimeParseException<\/code>.<\/p>","pista3":"<p>Para no repetir try/catch en cada manejador, captura las excepciones una sola vez en el router: <code>IllegalArgumentException<\/code> y <code>DateTimeParseException<\/code> → 400; <code>NoSuchElementException<\/code> → 404; cualquier otra → 500 sin detalles para el cliente.<\/p>"},"explica":{"reto":"<p>Explica cómo has diseñado las URLs de tu API: por qué <code>/habitos/{id}/registros<\/code> y no <code>/getRegistrosDeHabito?id=gym<\/code>. ¿Qué significa cada código de estado que devuelves, y por qué ese y no otro?<\/p>","guia":["Recursos (sustantivos) y verbos HTTP.","Parámetros de ruta frente a parámetros de query: cuándo usar cada uno.","200, 400, 404, 405 y 500: quién tiene la culpa en cada caso.","Tus percentiles: por qué el p99 y no la media."]}},"bloque":4,"titulo":"API REST de lectura con HttpServer","resumen":"Pasas del socket crudo al HttpServer que trae el JDK y construyes tu propio router con parámetros de ruta. Tu tracker empieza a hablar JSON con tu propio serializador.","sabes":["Tu servidor de sockets y tu generador de carga (semana 13).","Tu serializador JSON (semana 9).","<code>TrackerService<\/code> y los índices por fecha (semanas 8, 10 y 11)."],"nuevo":["<code>com.sun.net.httpserver.HttpServer<\/code>, incluido en el JDK.","Diseño REST: recursos, verbos y códigos de estado.","Un router con parámetros de ruta: <code>/habitos/{id}<\/code>.","Latencia por percentiles: p50, p95 y p99."],"objetivos":["Tener un router propio que resuelve <code>/habitos/{id}/registros<\/code>.","Servir 4 endpoints GET en JSON.","Medir la latencia de tu API por percentiles."],"tracker":"API REST de lectura: hábitos, registros por rango e informe semanal en JSON."},{"n":15,"sesiones":{"construir":{"titulo":"Tu parser JSON","objetivo":"Escribir un parser JSON recursivo descendente que convierte texto en Map, List, String, Double, Boolean y null.","reto":"<p>Crea <code>json.JsonParser<\/code>:<\/p><pre><code class=\"lang-java\">public static Object parse(String texto)<\/code><\/pre><p>Estructura: una clase con un <code>String s<\/code> y un índice <code>int pos<\/code>, y un método por cada regla de JSON:<\/p><ul><li><code>valor()<\/code>: mira el carácter actual y decide qué método llamar.<\/li><li><code>objeto()<\/code>, <code>array()<\/code>, <code>cadena()<\/code>, <code>numero()<\/code> y <code>literal()<\/code> (true, false, null).<\/li><li><code>saltarEspacios()<\/code>.<\/li><\/ul><p>Los errores lanzan una <code>JsonException<\/code> con la posición: <code>\"Esperaba ':' en la posición 14\"<\/code>.<\/p><p><strong>Prueba de ida y vuelta:<\/strong> con 5 estructuras distintas (una de ellas anidada a 3 niveles), comprueba que <code>parse(Json.escribir(x)).equals(x)<\/code>. Usa números <code>Double<\/code> en las pruebas, porque tu parser siempre devuelve Double.<\/p>","hecho":["Las 5 pruebas de ida y vuelta pasan.","<code>parse(\"{\\\"a\\\": }\")<\/code> lanza una <code>JsonException<\/code> con una posición útil.","Los espacios y saltos de línea entre elementos no afectan."],"minima":"<p>Solo objetos planos con valores de texto y número (sin anidar ni arrays).<\/p>","pista1":"<p>Mira el carácter actual para decidir: <code>{<\/code> → objeto, <code>[<\/code> → array, <code>\"<\/code> → cadena, <code>t<\/code>/<code>f<\/code>/<code>n<\/code> → literal, <code>-<\/code> o un dígito → número. Cada método consume su parte y deja <code>pos<\/code> justo después. La pila de llamadas lleva la cuenta del anidamiento: es tu validador de paréntesis, pero con la pila implícita.<\/p>","pista2":"<pre><code class=\"lang-java\">private Map&lt;String, Object&gt; objeto() {\n    esperar('{');\n    Map&lt;String, Object&gt; m = new LinkedHashMap&lt;&gt;();\n    saltarEspacios();\n    if (actual() == '}') { pos++; return m; }\n    while (true) {\n        saltarEspacios();\n        String clave = cadena();\n        saltarEspacios(); esperar(':');\n        m.put(clave, valor()); // valor() empieza saltando espacios\n        saltarEspacios();\n        if (actual() == ',') { pos++; continue; }\n        esperar('}');\n        return m;\n    }\n}<\/code><\/pre>","pista3":"<p><code>numero()<\/code>: avanza mientras el carácter esté en <code>-+.eE0123456789<\/code> y después haz <code>Double.parseDouble(s.substring(inicio, pos))<\/code>. <code>cadena()<\/code>: usa un <code>StringBuilder<\/code>; si encuentras una <code>\\<\/code>, mira el carácter siguiente (<code>\"<\/code>, <code>\\<\/code>, <code>n<\/code>, <code>t<\/code>…) y añade el carácter real. <code>\\uXXXX<\/code> es una misión secundaria: <code>(char) Integer.parseInt(hex, 16)<\/code>.<\/p>"},"medir":{"titulo":"Velocidad de tu parser","objetivo":"Medir el rendimiento de tu parser en MB/s, encontrar su complejidad y aplicar una optimización medida.","reto":"<ol><li>Genera con tu serializador un JSON con 10 000 registros (cada uno, un objeto con 3 o 4 campos). Apunta su tamaño en KB.<\/li><li>Mide cuántos <strong>MB/s<\/strong> parsea tu parser (con calentamiento).<\/li><li>Pásale el Complejómetro duplicando el número de registros. Debería salir k ≈ 1; si sale más, tienes un O(n²) escondido.<\/li><li><strong>Parche de rendimiento:<\/strong> busca el método donde se va más tiempo (mide cada uno con contadores de nanoTime o comentando partes), optimízalo y vuelve a medir. Apunta el antes y el después.<\/li><\/ol>","hecho":["Los MB/s de antes y después del parche, en la libreta.","k ≈ 1 confirmada.","Una frase que explica qué has optimizado y por qué ha funcionado."],"minima":"<p>Solo los pasos 1 y 2.<\/p>","pista1":"<p>Sospechosos habituales de un O(n²) escondido: concatenar con <code>+=<\/code> dentro de <code>cadena()<\/code> (semana 0), o hacer <code>s.substring(pos)<\/code> para mirar el resto del texto (copia todo el resto en cada llamada).<\/p>","pista2":"<p>Optimizaciones típicas: comparar caracteres con <code>s.charAt(pos)<\/code> en lugar de crear Strings; en <code>cadena()<\/code>, si no hay ninguna <code>\\<\/code>, hacer un único <code>substring<\/code> al final en lugar de añadir carácter a carácter; reutilizar un único <code>StringBuilder<\/code>.<\/p>","pista3":"<p>Órdenes de magnitud orientativos: un parser sencillo como el tuyo suele estar entre 20 y 200 MB/s, y los parsers profesionales, entre 300 MB/s y más de 1 GB/s. No compites con ellos: lo importante es saber medir y saber por qué ayuda cada cambio.<\/p>"},"aplicar":{"titulo":"Endpoints de escritura","objetivo":"Implementar las operaciones de escritura de la API con los códigos de estado correctos.","reto":"<ul><li><code>POST /habitos<\/code> → crea. Responde <strong>201<\/strong> con el hábito y la cabecera <code>Location: /habitos/{id}<\/code>.<ul><li>JSON mal formado → <strong>400<\/strong>.<\/li><li>Datos inválidos (nombre vacío, objetivo imposible) → <strong>422<\/strong>, con el mensaje de tu validación (semana 1).<\/li><li>Ya existe uno con ese nombre → <strong>409<\/strong> (tu <code>CatalogoHabitos<\/code>, semana 1).<\/li><\/ul><\/li><li><code>PUT /habitos/{id}<\/code> → lo reemplaza entero (idempotente). 404 si no existe.<\/li><li><code>DELETE /habitos/{id}<\/code> → <strong>204<\/strong> sin cuerpo. 404 si no existe.<\/li><li><code>POST /habitos/{id}/registros<\/code> con <code>{\"fecha\": \"2026-12-07\", \"valor\": 1}<\/code> → marca y publica el evento (tus rachas de la semana 12 siguen funcionando).<\/li><li><code>DELETE /habitos/{id}/registros/{fecha}<\/code> → desmarca.<\/li><\/ul>","hecho":["Cada código de estado de la lista tiene un comando <code>curl<\/code> que lo provoca.","Repetir el mismo <code>PUT<\/code> dos veces deja el mismo estado (idempotencia).","Marcar 7 días seguidos por la API dispara el aviso de racha."],"minima":"<p><code>POST /habitos<\/code> con 201 y 400, y <code>DELETE /habitos/{id}<\/code>.<\/p>","pista1":"<p>Con <code>curl<\/code>: <code>curl -i -X POST localhost:8080/habitos -H \"Content-Type: application/json\" -d '{\"nombre\":\"Gym\",\"objetivo\":\"DIAS_MINIMOS:4\"}'<\/code>. La opción <code>-i<\/code> muestra el código de estado y las cabeceras.<\/p>","pista2":"<p>¿400 o 422? 400: no entiendo lo que me envías (JSON roto). 422: lo entiendo, pero los datos no son válidos para mi dominio. 409: es válido, pero choca con el estado actual (ya existe). Es una convención, no una ley: lo importante es que tu API sea coherente y que tu explicación lo justifique.<\/p>","pista3":"<p>Crea excepciones de dominio (<code>HabitoDuplicadoException<\/code>, <code>ValidacionException<\/code>) y tradúcelas a códigos en un único sitio del router. Así <code>TrackerService<\/code> no sabe nada de HTTP, y si mañana el tracker tuviera otra interfaz (consola, colas de mensajes), las reglas de negocio seguirían intactas.<\/p>"},"explica":{"reto":"<p>Explica cómo sabe tu parser dónde termina un objeto anidado dentro de otro, sin contar llaves a mano. Después explica la diferencia entre 400, 404, 409 y 422 con ejemplos de tu API.<\/p>","guia":["Parser recursivo descendente: un método por cada regla de la gramática.","La pila de llamadas como pila implícita (tu validador de paréntesis de la semana 7).","Tu O(n²) escondido, si lo encontraste, y tu parche.","Errores del cliente: qué significa cada código y quién debe corregir qué."]}},"bloque":4,"titulo":"Escribir en la API: parser JSON y errores","resumen":"Tu API aprende a recibir datos. Escribes un parser JSON recursivo (el mismo tipo de algoritmo que usan los compiladores), los endpoints de escritura y un manejo de errores digno de producción.","sabes":["Pilas y el validador de paréntesis (semana 7).","Recursión y tu serializador (semana 9).","El router y los endpoints de lectura (semana 14)."],"nuevo":["Parser recursivo descendente: leer JSON carácter a carácter.","POST, PUT y DELETE; la idempotencia.","Los códigos 201, 204, 400, 404, 409 y 422.","La cabecera <code>Location<\/code>."],"objetivos":["Que <code>parse(escribir(x))<\/code> devuelva x en estructuras anidadas.","Crear, modificar y borrar hábitos y registros por HTTP.","Que ningún error interno llegue al cliente con una traza."],"tracker":"API REST completa de escritura (CRUD de hábitos y registros)."},{"n":16,"sesiones":{"construir":{"titulo":"Pruebas de extremo a extremo","objetivo":"Probar la API completa contra un servidor real arrancado desde las propias pruebas.","reto":"<p>Crea <code>PruebasApi<\/code>, que:<\/p><ol><li>Arranca tu servidor en un <strong>puerto libre aleatorio<\/strong> (<code>new InetSocketAddress(0)<\/code> y después <code>server.getAddress().getPort()<\/code>) con el DAO en memoria.<\/li><li>Con <code>HttpClient<\/code> y tu parser JSON, ejecuta un escenario completo:<ul><li>crea 4 hábitos (dormir, comer bien, gym, dientes)<\/li><li>marca una semana de registros variada<\/li><li>comprueba el informe semanal (quién cumple y quién no)<\/li><li>intenta crear un duplicado (409) y un hábito inválido (422), y pide uno inexistente (404)<\/li><li>desmarca un día y comprueba que el informe cambia<\/li><li>borra un hábito (204) y comprueba que ya no aparece<\/li><\/ul><\/li><li>Para el servidor e imprime el resumen de <code>Check<\/code>.<\/li><\/ol>","hecho":["Un solo <code>main<\/code> ejecuta todo el escenario y termina con 0 fallos.","Las pruebas no dependen de datos de ejecuciones anteriores (DAO en memoria y puerto aleatorio).","Al menos 20 checks."],"minima":"<p>3 escenarios: crear, listar y pedir uno inexistente (404).<\/p>","pista1":"<p>Saca el arranque del servidor a un método <code>static HttpServer arrancar(int puerto, TrackerService servicio)<\/code> que usen tanto <code>Main<\/code> como <code>PruebasApi<\/code>. Así pruebas exactamente el mismo código que ejecutas.<\/p>","pista2":"<p>Crea un pequeño ayudante, <code>Object llamar(String metodo, String ruta, String cuerpoJson, int estadoEsperado)<\/code>, que hace la petición, comprueba el estado con <code>Check<\/code> y devuelve el cuerpo ya parseado. Tus pruebas quedarán cortas y legibles.<\/p>","pista3":"<p>Llama a <code>server.stop(0)<\/code> al final. Si una prueba falla a mitad, usa <code>try/finally<\/code> para parar el servidor igualmente: si no, el proceso se queda vivo con el puerto ocupado.<\/p>"},"medir":{"titulo":"Informe de rendimiento v1.0","objetivo":"Medir la API completa bajo carga y desglosar la latencia por capas, como un desglose de daño por habilidad.","reto":"<ol><li>Carga mixta con tu <code>Carga<\/code>: 5 000 peticiones, 50 concurrentes, 80 % GET y 20 % POST.<\/li><li>Apunta las peticiones por segundo, p50, p95 y p99, con el DAO en memoria y con el de fichero.<\/li><li><strong>Desglose por capas:<\/strong> mide con <code>nanoTime<\/code> cuánto tiempo pasa cada petición en el parseo JSON, el router, <code>TrackerService<\/code>, el DAO y la serialización. Acumula por capa e imprime el porcentaje del total.<\/li><li>Escribe 5 líneas de conclusiones: ¿dónde está el cuello de botella? ¿Qué optimizarías primero?<\/li><\/ol>","hecho":["La tabla de rendimiento de las dos configuraciones.","El desglose por capas en porcentaje.","5 conclusiones apoyadas en tus números."],"minima":"<p>Peticiones por segundo y p99 de una configuración.<\/p>","pista1":"<p>Para el desglose, usa contadores estáticos <code>LongAdder<\/code> por capa (son seguros con varios hilos): <code>Metricas.dao.add(System.nanoTime() - t0)<\/code>. Al final, imprime cada uno dividido entre el total.<\/p>","pista2":"<p>Lo esperable: con el DAO en memoria, la mayor parte del tiempo se va en la red y en el propio HttpServer, y tu código es una fracción pequeña. Con fichero, el DAO domina, sobre todo en los POST. Si no ves esto, investiga: puede ser un hallazgo interesante.<\/p>
